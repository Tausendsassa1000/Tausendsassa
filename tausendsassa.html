<html lang="de">
<head>
<meta charset="UTF-8">

</head>

<div id="ts-app-root">
  <div class="ts-title-main">TAUSENDSASSA</div>
  <div class="ts-sub">8 Kategorien &bull; Der ganze Mensch</div>

        <input type="text" class="ts-p-in" placeholder="Name Spieler 2...">

      <label>Schwierigkeitsgrad:</label>
      <select id="ts-diff">
        <option value="alle">Gemischt (Alle Stufen)</option>
        <option value="leicht">Leicht</option>
        <option value="mittel">Mittel</option>
        <option value="knacknuss">Knacknuss</option>
      </select>
    </div>
    <div class="ts-fg">
      <label>Gesamt-Spieldauer:</label>
      <select id="ts-dur">
        <option value="0">Unbegrenzt (Bis jemand alle 8 Kategorien erfüllt)</option>
        <option value="15">15 Minuten</option>
        <option value="30" selected>30 Minuten</option>
        <option value="45">45 Minuten</option>
        <option value="60">60 Minuten</option>
      </select>
    </div>
    <div id="ts-status" style="font-weight:600; margin-bottom:12px; color:#64748b;">Initialisiere...</div>
    <button type="button" class="ts-btn ts-btn-ok ts-blk" onclick="tsStart()">Spiel starten</button>
  </div>

  <div id="ts-s-priv" class="ts-scr">
    <div class="ts-bar">
      <div>Am Zug: <strong id="ts-p-act"></strong> (Serie: <span id="ts-p-str">0</span>/3)</div>
      <div>Restzeit: <strong id="ts-g-tmr">--:--</strong></div>
    </div>
    <div class="ts-priv">
      <div>Gerät bitte weitergeben an Vorleser/in:</div>
      <div id="ts-p-rdr" style="color:var(--p); margin:8px 0; font-size:1.5rem; font-weight:700;"></div>
      <p><strong id="ts-p-hide"></strong> darf jetzt nicht auf den Bildschirm schauen!</p>
      <div id="ts-j-msg" style="display:none; background:#fef3c7; color:#92400e; padding:8px; border-radius:6px; margin-bottom:12px; font-weight:bold;"></div>
      <button type="button" class="ts-btn" onclick="tsReveal()">Aufgabe aufdecken</button>
    </div>
    <div id="ts-sb-1"></div>
  </div>

  <div id="ts-s-task" class="ts-scr">
    <div class="ts-bar">
      <div>Spieler: <strong id="ts-t-act"></strong> | Vorleser: <strong id="ts-t-rdr"></strong></div>
      <div><span class="ts-bdg" id="ts-t-cat"></span> <span class="ts-bdg" id="ts-t-joker" style="background:var(--s); display:none;">JOKER</span></div>
    </div>
    <div class="ts-card">
      <div style="font-size:0.85rem; color:#64748b;" id="ts-t-meta"></div>
      <div class="ts-t-title" id="ts-t-tit"></div>
      <div class="ts-t-desc" id="ts-t-dsc"></div>
      <div class="ts-tmr" id="ts-t-tmr">00:45</div>
      <div style="text-align:center; margin-bottom:12px;">
        <button type="button" class="ts-btn ts-btn-sec" id="ts-b-tmr" onclick="tsTglTmr()">Timer starten</button>
        <button type="button" class="ts-btn ts-btn-warn" id="ts-b-hnt" style="display:none;" onclick="tsShowHnt()">Halbzeit-Empfehlung</button>
      </div>
      <div class="ts-hint" id="ts-t-hnt"></div>
      <div class="ts-sol"><strong>Lösung / Kriterium:</strong> <span id="ts-t-sol"></span></div>
      <div style="display:flex; gap:10px;">
        <button type="button" class="ts-btn ts-btn-ok" style="flex:1;" onclick="tsDone(true)">✔ Erfüllt</button>
        <button type="button" class="ts-btn ts-btn-no" style="flex:1;" onclick="tsDone(false)">✖ Nicht erfüllt</button>
      </div>
    </div>
  </div>

  <div id="ts-s-end" class="ts-scr">
    <div style="text-align:center; color:var(--ok); font-size:1.5rem; font-weight:700; margin-bottom:10px;">Spiel beendet!</div>
    <p id="ts-e-rsn" style="text-align:center;"></p>
    <div id="ts-e-win" style="background:#ecfdf5; border:2px solid var(--ok); padding:15px; border-radius:10px; text-align:center; font-weight:bold; font-size:1.2rem;"></div>
    <div id="ts-sb-2"></div>
    <button type="button" class="ts-btn ts-blk" onclick="location.reload()">Neues Spiel</button>
  </div>
</div>

  [1,"mittel",45,"Seiltänzer-Linie","Lege ein Band oder einen Gürtel in Schlangenlinien auf den Boden. Balanciere mit geschlossenen Augen darüber, indem du den Faden mit den Fusssohlen ertastest.","Setze Ferse direkt vor Spitze auf.","Komplette Linie abgelaufen ohne komplett daneben zu treten."],
  [1,"knacknuss",60,"Zwei-Münzen-Schlag","Lege eine Münze auf deinen gestreckten Unterarm und eine zweite auf dein Handgelenk. Schnappe vor und fange beide Münzen gleichzeitig aus der Luft.","Führe die Hand blitzschnell auf einer Linie nach unten.","Beide Münzen gleichzeitig gefangen (max. 4 Versuche)."],
  [1,"leicht",35,"Schuhband-Blindflug","Binde dir mit geschlossenen Augen eine ordentliche Doppelschleife in deinen Schuh (oder ein Band).","Verlasse dich ganz auf dein Tastgefühl in den Fingerspitzen.","Feste Schleife gebunden."],
  [1,"mittel",45,"Kugel-Labyrinth","Lege ein Blatt Papier mit hochgeknickten Rändern als Tablett bereit, lege eine kleine Kugel (oder Erbse/Münze) hinein und führe sie 15 Sekunden im Kreis, ohne dass sie den Rand berührt.","Neige das Blatt mit beiden Händen ganz behutsam.","15 Sekunden ohne Randberührung."],
  [1,"leicht",30,"Stift-Hammer","Stelle einen Stift senkrecht auf den Tisch, tippe ihn oben an, sodass er kippt, und fange ihn mit derselben Hand kurz vor der Tischplatte wieder auf (3 Mal).","Halte die Hand flach und offen direkt neben dem Stift bereit.","3 Mal erfolgreich aufgefangen."],
  [1,"mittel",45,"Doppel-Kugel-Jonglage","Jongliere zwei kleine Bälle oder zusammengeknüllte Papiersocken 15 Sekunden lang mit nur EINER Hand.","Wirf den ersten Ball hoch und wirf den zweiten erst ab, wenn der erste am höchsten Punkt ist.","15 Sekunden flüssig jongliert."],
  [1,"knacknuss",60,"Dominosteine-aus-Karten","Falte 6 Spielkarten oder Zettel in der Mitte und stelle sie wie Dominosteine hintereinander auf. Stosse den ersten an, sodass alle 6 umfallen.","Der Abstand zwischen zwei Karten muss etwas kleiner sein als die Kartenhöhe.","Alle 6 Karten fallen in einer Kettenreaktion."],
  [1,"leicht",30,"Tisch-Curling","Schiebe eine Münze so über den Tisch, dass sie möglichst nah an der gegenüberliegenden Tischkante liegen bleibt, ohne herunterzufallen (3 Versuche).","Gib der Münze nur einen sanften Schubs mit der Fingerkuppe.","Münze liegt maximal 3 cm von der Kante entfernt."],
  [1,"mittel",45,"Gabel-Zinken-Balance","Stecke zwei Gabeln mit den Zinken ineinander, klemme eine Münze dazwischen und balanciere das Ganze auf dem Rand eines Glases.","Der Schwerpunkt der Gabelgriffe muss unterhalb des Glasrandes hängen.","Konstruktion hängt 5 Sekunden frei am Glasrand."],
  [1,"leicht",30,"Strohhalm-oder-Stift-Zange","Hebe 5 verschiedene Gegenstände (z.B. Schlüssel, Münze, Stift, Socke, Zettel) nur mit deinen Zeigefingern beider Hände vom Tisch auf.","Drücke die Gegenstände seitlich zwischen den beiden Zeigefingerkuppen ein.","Alle 5 Gegenstände erfolgreich hochgehoben."],
  [1,"mittel",45,"Papier-Bumerang","Falte oder schneide ein kleines Papier-V (oder nutze ein gefaltetes Blatt) und wirf es so, dass es im Bogen wieder in deine Richtung zurückkehrt.","Wirf das Papier schräg nach oben mit starkem Vorwärtsdrall.","Deutliche Rückwärtskurve erkennbar (4 Versuche)."],
  [1,"knacknuss",60,"Turmbau-mit-Handicap","Baue einen Turm aus 5 Gegenständen, während du einen Gegenstand (z.B. ein Buch) auf deinem Kopf balancierst.","Gehe in die Knie, statt den Kopf nach vorne zu neigen.","Turm steht 3 Sekunden und das Buch bleibt auf dem Kopf."],
  [1,"leicht",30,"Münzen-Tausch","Halte in jeder Hand eine Münze. Wirf beide gleichzeitig hoch und fange sie überkreuzt mit der jeweils anderen Hand wieder auf (3 Mal hintereinander).","Wirf beide Münzen auf exakt die gleiche Höhe.","3 Mal fehlerfrei überkreuzt gefangen."],
  [1,"mittel",45,"Blind-Zeichnen-Haus","Zeichne mit geschlossenen Augen das 'Haus vom Nikolaus' in einem Zug, ohne den Stift abzusetzen.","Zähle die 8 Striche im Kopf mit und merke dir die Ecken.","Erkennbares Haus vom Nikolaus gezeichnet."],
  [1,"leicht",30,"Finger-Akrobatik","Lege beide Hände flach auf den Tisch. Hebe nun einzeln nacheinander nur die Ringfinger an, ohne dass sich ein anderer Finger bewegt.","Drücke die übrigen Finger leicht auf die Tischplatte.","Beide Ringfinger sauber isoliert angehoben."],
  [1,"mittel",45,"Becher-Stapel-Speed","Nimm 6 Becher, stapele sie zu einer 3-2-1-Pyramide auf und schiebe sie danach wieder zu einem einzigen Stapel zusammen – in unter 12 Sekunden.","Arbeite beidhändig: links und rechts gleichzeitig greifen.","Auf- und Abbau in unter 12 Sekunden."],
  [1,"knacknuss",60,"Karten-Katapult","Lege eine Spielkarte halb über die Tischkante, platziere eine kleine Papierkugel darauf und schnipse die Karte hoch, sodass die Kugel in einer Tasse in 1 Meter Entfernung landet.","Halte die Karte hinten leicht fest, damit sie nur federt.","Treffer innerhalb von 6 Versuchen."],
  [1,"leicht",30,"Rückwärts-Schreiben","Schreibe das Wort 'TAUSENDSASSA' spiegelverkehrt (von rechts nach links) auf ein Blatt Papier, sodass man es im Spiegel (oder gegen das Licht) normal lesen kann.","Stelle dir jeden Buchstaben umgedreht vor.","Komplettes Wort spiegelverkehrt lesbar."],
  [1,"mittel",45,"Löffel-Staffel","Balanciere eine Münze auf einem Teelöffel, den du am äussersten Stielende hältst, während du dich einmal auf den Boden setzt und wieder aufstehst.","Halte den Löffel waagerecht und schaue immer auf die Münze.","Hingesetzt und aufgestanden ohne Verlust der Münze."],
  [1,"leicht",30,"Zettel-Fänger","Ein Mitspieler hält ein Blatt Papier senkrecht am oberen Rand. Du hältst Daumen und Zeigefinger offen am unteren Rand und musst es fangen, sobald er es ohne Vorwarnung loslässt.","Schaue nicht auf das Papier, sondern auf die Finger des Mitspielers!","Papier im Fall aufgefangen (max. 3 Versuche)."],
  [1,"mittel",45,"Kugel-Pusten","Puste eine leichte Papierkugel über den Tisch in ein aufgestelltes Ziel (z.B. zwischen zwei Stifte), ohne sie zu berühren – in unter 10 Sekunden.","Puste flach über die Tischplatte statt steil von oben.","Ziel in unter 10 Sekunden erreicht."],
  [1,"knacknuss",60,"Einhand-Turm","Baue mit nur EINER Hand einen freistehenden Turm aus mindestens 6 unterschiedlichen Gegenständen vom Tisch.","Nutze flache Dinge als Zwischenböden für unebene Gegenstände.","Turm aus 6 Teilen steht 5 Sekunden frei."],
  [1,"leicht",30,"Daumen-Krieg-Solo","Lasse deine beiden Daumen 15 Sekunden lang ein rasantes Duell gegeneinander führen, bei dem jeder Daumen versucht, den anderen 3 Mal kurz festzuhalten.","Bewege beide Hände gleichzeitig flüssig mit.","Unterhaltsames, schnelles Duell absolviert."],
  [1,"mittel",45,"Stift-Wurf-Fang","Lege einen Stift flach auf deine offene Handfläche, wirf ihn hoch, sodass er sich einmal in der Luft dreht, und fange ihn wieder auf der offenen Handfläche auf (3 Mal).","Wenig Schwung aus dem Unterarm geben, damit er sich nur einmal dreht.","3 saubere Drehungen und Fänge."],
  [1,"leicht",30,"Socken-Basketball","Rolle ein Paar Socken zu einem Ball zusammen und triff damit aus 3 Metern Entfernung in einen Wäschekorb, Stuhl oder Eimer (4 Versuche).","Wirf mit beiden Händen von unten nach oben.","Mindestens ein Treffer."],
  [1,"mittel",45,"Münzen-Schieber","Lege 4 Münzen in einer Reihe auf den Tisch. Schnipse die erste Münze so an, dass sie die letzte Münze wegschiesst, während die mittleren liegen bleiben (Newton-Wiege).","Drücke die mittleren Münzen nicht fest – sie geben den Impuls von selbst weiter.","Die äussere Münze fliegt weg, die mittleren bleiben liegen."],
  [1,"knacknuss",60,"Blind-Knoten-Kette","Mache mit geschlossenen Augen 4 einzelne Knoten hintereinander in ein langes Band oder Schnürsenkel.","Fühle nach jedem Knoten mit den Fingern, wo das freie Ende weitergeht.","4 echte Knoten im Band."],
  [1,"leicht",30,"Ringfinger-Lift","Lege beide Hände flach auf den Tisch. Hebe einzeln nacheinander nur die Ringfinger an, ohne andere Finger zu bewegen.","Übrige Finger leicht auf den Tisch drücken.","Beide Ringfinger isoliert angehoben."],
  [1,"mittel",45,"Becher-Speed","Stapele 6 Becher zu einer 3-2-1-Pyramide auf und wieder zusammen – in unter 12 Sekunden.","Beidhändig arbeiten: links und rechts gleichzeitig greifen.","Auf- und Abbau in unter 12 Sekunden."],
  [1,"leicht",30,"Spiegel-Schrift","Schreibe das Wort 'TAUSENDSASSA' spiegelverkehrt auf ein Blatt, sodass man es im Spiegel normal lesen kann.","Stelle dir jeden Buchstaben umgedreht vor.","Komplettes Wort spiegelverkehrt lesbar."],
  [1,"mittel",45,"Löffel-Kniebeuge","Balanciere eine Münze auf einem Teelöffel, während du dich einmal auf den Boden setzt und wieder aufstehst.","Löffel waagerecht halten, immer auf die Münze schauen.","Geschafft ohne Verlust der Münze."],
  [1,"leicht",30,"Daumen-Duell","Lasse deine beiden Daumen 15 Sekunden lang ein rasantes Duell führen, bei dem jeder den anderen 3 Mal kurz festhält.","Beide Hände gleichzeitig flüssig mitbewegen.","Schnelles Duell absolviert."],
  [1,"mittel",45,"Stift-Flip","Lege einen Stift flach auf deine Handfläche, wirf ihn hoch (1 Drehung) und fange ihn wieder flach auf (3 Mal).","Wenig Schwung aus dem Unterarm geben.","3 saubere Drehungen und Fänge."],
  [1,"leicht",30,"Socken-Korb","Rolle ein Paar Socken zu einem Ball und triff aus 3 Metern in einen Wäschekorb oder Eimer (4 Versuche).","Mit beiden Händen von unten nach oben werfen.","Mindestens ein Treffer."],
  [1,"mittel",45,"Münzen-Impuls","Lege 4 Münzen in einer Reihe auf den Tisch. Schnipse die erste so an, dass die letzte wegschiesst und die mittleren liegen bleiben.","Mittlere Münzen nicht festdrücken.","Äussere Münze fliegt weg, mittlere bleiben."],
  [1,"leicht",30,"Stift-Mikado","Halte 10 Stifte senkrecht in der Faust auf dem Tisch, lasse sie los und nimm sie einzeln weg, ohne dass ein anderer wackelt (5 Stück).","Mit den obersten, freiliegenden Stiften beginnen.","5 Stifte ohne Wackeln entfernt."],
  [1,"mittel",45,"Wäscheklammer-Kette","Klemme dir innerhalb von 20 Sekunden so viele Wäscheklammern (oder Büroklammern) wie möglich mit einer Hand an den Ärmel (mind. 6 Stück).","Klammern vorher griffbereit auf den Tisch legen.","Mindestens 6 Klammern angeklemmt."],
  [1,"knacknuss",60,"Tischkanten-Balance","Lege ein Lineal oder einen Kochlöffel über die Tischkante und hänge einen leichten Gegenstand (z.B. Schlüsselbund an einem Band) daran, sodass es balanciert.","Der Schwerpunkt muss unter die Tischkante wandern.","Konstruktion hängt 5 Sekunden stabil."],
  [1,"leicht",30,"Nasen-Tipp-Speed","Berühre im Wechsel mit dem linken Zeigefinger die Nase und mit dem rechten das linke Ohr – 15 Mal fehlerfrei und schnell.","Langsam starten und Tempo steigern.","15 fehlerfreie Wechsel."],
  [1,"mittel",45,"Becher-Pusten","Stelle einen leichten Plastik- oder Pappbecher auf den Tisch und puste ihn so an, dass er sich einmal überschlägt und richtig herum stehen bleibt.","Kräftiger, kurzer Luftstoss an den oberen Rand.","Becher steht wieder richtig (max. 5 Versuche)."],
  [1,"leicht",30,"Münz-Dreher","Bringe eine Münze auf dem Tisch wie einen Kreisel zum Drehen und stoppe sie mit einem einzigen Finger von oben, sodass sie flach liegen bleibt (3 Mal).","Münze mit einem Finger festhalten, mit dem anderen anschnipsen.","3 Mal sauber gestoppt."],
  [1,"mittel",45,"Karten-Zielschuss","Schnipse eine Spielkarte aus 1 Meter Entfernung in einen offenen Topf, Hut oder auf einen Stuhl (5 Versuche).","Karte flach aus dem Handgelenk drehen.","Mindestens ein Treffer."],
  [1,"knacknuss",60,"Faden-Turm","Stelle einen Bleistift senkrecht auf den Tisch, lege ein kleines Papierstück auf die Spitze und blase es herunter, ohne dass der Stift umfällt.","Ganz feiner, gezielter Luftstoss nur auf das Papier.","Papier fliegt weg, Stift bleibt stehen."],
  [1,"leicht",30,"Zwei-Hände-Kreis","Male mit der rechten Hand einen Kreis in die Luft und gleichzeitig mit der linken ein Dreieck – 10 Sekunden lang.","Auf die Ecken der linken Hand konzentrieren.","Beide Formen klar erkennbar."],
  [1,"mittel",45,"Schlüssel-Fänger","Wirf einen Schlüsselbund hoch, klatsche zweimal in die Hände und fange ihn wieder auf (3 Mal hintereinander).","Hoch genug werfen, um Zeit zum Klatschen zu haben.","3 Mal erfolgreich gefangen."],
  [1,"leicht",30,"Papier-Falt-Boot","Falte aus einem rechteckigen Blatt Papier ein klassisches Papierboot in unter 35 Sekunden.","Erst halbieren, Ecken zur Mitte, Ränder hochklappen.","Fertiges Papierboot in unter 35 Sek."],
  [1,"mittel",45,"Münzen-Labyrinth","Führe eine Münze mit nur einem Finger auf einer gedachten Acht um zwei auf dem Tisch stehende Gläser herum, ohne die Gläser zu berühren.","Münze mittig mit der Fingerkuppe führen.","Komplette Acht ohne Glasberührung."],
  [1,"knacknuss",60,"Turm-auf-dem-Handrücken","Lege 4 Münzen auf deinen Handrücken, gehe einmal um den Tisch und lege sie wieder ab, ohne dass eine herunterfällt.","Handgelenk komplett waagerecht halten.","Alle 4 Münzen sicher ans Ziel gebracht."],
  [1,"leicht",30,"Finger-Schnipser-Takt","Schnipse mit beiden Händen abwechselnd im schnellen Takt 20 Mal hintereinander, ohne auszusetzen.","Mittelfinger fest gegen den Daumenballen drücken.","20 laute Schnipser in Folge."],
  [1,"mittel",45,"Stift-Rolle","Puste einen runden Bleistift über den Tisch so an, dass er genau auf einer mit einem Zettel markierten Ziellinie liegen bleibt (3 Versuche).","Sanft pusten, damit der Stift nicht zu viel Schwung holt.","Stift berührt die Ziellinie."],
  [1,"leicht",30,"Einhand-Mischen","Teile einen Stapel Spielkarten (oder Zettel) mit einer Hand in zwei Hälften und schiebe sie wieder ineinander.","Daumen oben, Ring- und kleiner Finger unten.","Mit einer Hand geteilt und zusammengeschoben."],
  [1,"mittel",45,"Glas-Rand-Münze","Lege eine Münze flach auf die Tischkante und schnipse sie von unten so hoch, dass sie in einem danebenstehenden Glas landet (5 Versuche).","Glas direkt neben die Tischkante stellen.","Münze landet im Glas."],
  [1,"knacknuss",60,"Blind-Stapel","Schliesse die Augen und stapele 6 Münzen mit nur einer Hand exakt übereinander.","Münzen einzeln zwischen Daumen und Zeigefinger ausrichten.","Turm aus 6 Münzen steht 3 Sekunden."],
  [1,"leicht",30,"Kugel-Wurf-Über-Kopf","Wirf eine Papierkugel rückwärts über deine Schulter in einen 1,5 Meter hinter dir stehenden Korb oder Karton (5 Versuche).","Hohe Flugkurve wählen.","Mindestens ein Treffer."],
  [1,"mittel",45,"Schuh-Aus-An-Speed","Ziehe beide Schuhe aus, stelle sie überkreuzt hin und ziehe sie wieder richtig herum an (inkl. Schnüren) – in unter 35 Sekunden.","Schnürsenkel nur so weit lockern wie nötig.","Beide Schuhe komplett angezogen in unter 35 Sek."],
  [1,"leicht",30,"Handrücken-Fänger","Lege 3 Münzen auf deinen Handrücken, wirf sie leicht hoch und fange alle 3 gleichzeitig mit derselben Hand aus der Luft.","Hand kurz nach unten absenken und dann zupacken.","Alle 3 Münzen gefangen (max. 3 Versuche)."],
  [1,"mittel",45,"Karten-Turm-Wurf","Stelle eine gefaltete Spielkarte auf den Tisch und schiesse sie aus 1 Meter Entfernung mit einer Papierkugel um (5 Versuche).","Flach und gezielt werfen.","Karte umgeschossen."],
  [1,"knacknuss",60,"Münz-Turm-Transport","Baue einen Turm aus 5 Münzen auf einem Bierdeckel und trage ihn einmal komplett um den Tisch, ohne dass er umfällt.","Bierdeckel mit beiden Händen ruhig halten.","Turm übersteht die Runde."],
  [1,"leicht",30,"Daumen-Zeigefinger-Ring","Bilde mit Daumen und Zeigefinger beider Hände ineinander greifende Ringe und wechsele 15 Mal blitzschnell die Finger (Daumen-Mittelfinger, Daumen-Ringfinger, Daumen-Kleiner Finger).","Ruhig starten und Rhythmus steigern.","15 fehlerfreie Wechsel."],
  [1,"mittel",45,"Stift-Balancier-Wechsel","Balanciere einen Stift 5 Sekunden auf dem rechten Zeigefinger und übergib ihn direkt auf den linken Zeigefinger, ohne ihn festzuhalten.","Den freien Finger direkt unter dem Schwerpunkt ansetzen.","Übergabe ohne Herunterfallen geglückt."],
  [1,"leicht",30,"Papier-Fächer","Falte ein A4-Blatt in unter 20 Sekunden zu einer gleichmässigen Ziehharmonika (mindestens 8 Falten).","Papier nach jeder Falte umdrehen.","Gleichmässiger Fächer in unter 20 Sek."],
  [1,"mittel",45,"Becher-Zielwurf-Bande","Wirf eine leichte Papierkugel so auf den Tisch, dass sie einmal aufspringt und in einer Tasse landet (5 Versuche).","Einen Punkt etwa 30 cm vor der Tasse anvisieren.","Mindestens ein Treffer."],
  [1,"knacknuss",60,"Einhand-Knoten-Doppel","Mache mit nur einer Hand zwei getrennte Knoten in dasselbe Band oder Schnürsenkel.","Zweiten Knoten mit etwas Abstand zum ersten legen.","Zwei echte Knoten geknüpft."],
  [1,"leicht",30,"Finger-Trommel","Trommle mit allen 8 Fingern (ohne Daumen) nacheinander vom kleinen Finger bis zum Zeigefinger wie ein Pferdegalopp auf den Tisch – 15 Sekunden lang.","Handgelenke locker halten.","Gleichmässiger Galopp-Rhythmus."],
  [1,"mittel",45,"Münzen-Umdreher","Lege 8 Münzen nebeneinander auf den Tisch. Drehe alle 8 mit nur zwei Fingern einer Hand um – in unter 10 Sekunden.","Münzen am Rand leicht kippen und umdrehen.","Alle 8 Münzen in unter 10 Sek. gewendet."],
  [1,"knacknuss",60,"Stift-Spitze-auf-Münze","Lege eine Münze flach auf den Tisch und stelle einen Stift mit der stumpfen Rückseite genau auf die Mitte der Münze, sodass er 3 Sekunden steht.","Atem anhalten beim Loslassen.","Stift steht 3 Sekunden auf der Münze."],
  [1,"leicht",30,"Socken-Wurf-Rückwärts","Wirf ein zusammengerolltes Paar Socken zwischen deinen Beinen hindurch nach hinten in einen 1,5 Meter entfernten Korb (4 Versuche).","Leicht in die Knie gehen und nach oben schwingen.","Mindestens ein Treffer."],
  [1,"mittel",45,"Karten-Zielschieber","Schiebe eine Spielkarte so über den Tisch, dass sie genau halb über die gegenüberliegende Tischkante hinausragt, ohne herunterzufallen (4 Versuche).","Sanft aus dem Handgelenk anschieben.","Karte ragt über die Kante und bleibt liegen."],
  [1,"leicht",30,"Buch-Dreher","Drehe ein geschlossenes Buch 5 Mal hintereinander um 360 Grad in der Luft, indem du es hochwirfst und wieder fängst.","Mit beiden Händen an den Seiten greifen.","5 saubere Drehungen ohne Herunterfallen."],
  [1,"mittel",45,"Blind-Münzen-Sortierer","Lege 6 Münzen gemischt auf den Tisch. Sortiere sie mit geschlossenen Augen allein durch Ertasten der Grösse von klein nach gross.","Münzen paarweise zwischen den Fingern vergleichen.","Exakte Reihenfolge von klein nach gross."],
  [1,"knacknuss",60,"Drei-Gegenstände-Balance","Balanciere gleichzeitig einen Löffel auf der Nase, ein Buch auf dem Kopf und einen Stift auf dem Zeigefinger für 5 Sekunden.","Zuerst das Buch auflegen, dann den Löffel, zuletzt den Stift.","Alle 3 Gegenstände halten 5 Sekunden."],
  [1,"leicht",30,"Papier-Kugel-Slalom","Führe eine Papierkugel mit einem Stift als Hockeyschläger in unter 15 Sekunden im Slalom um 3 auf dem Tisch stehende Gläser.","Kurze, kontrollierte Stösse geben.","Parcours ohne Glasberührung gemeistert."],
  [1,"mittel",45,"Knoten-Mit-Stiften","Mache einen Knoten in ein Schnürsenkel, wobei du das Band nicht mit den Fingern, sondern nur mit zwei Stiften als Verlängerung berührst.","Stifte wie Pinzetten einsetzen.","Knoten erfolgreich gebunden."],
  [1,"leicht",30,"Wäscheklammer-Turm","Stecke 6 Wäscheklammern (oder Büroklammern) so ineinander, dass eine freistehende Kette oder Brücke entsteht.","Klammern abwechselnd versetzt anklemmen.","Gebilde hält 5 Sekunden zusammen."],
  [1,"knacknuss",60,"Münz-Stapel-Flip","Staple 3 Münzen auf deinen Handrücken, wirf den Stapel leicht hoch und fange alle 3 Münzen wieder mit derselben Hand auf.","Alle 3 Münzen exakt deckungsgleich stapeln.","Alle 3 Münzen gefangen (max. 4 Versuche)."],
  [2,"leicht",30,"Blinder Flamingo","Stehe auf einem Bein, schliesse die Augen und berühre mit dem Finger deine Nasenspitze (15 Sek.).","Bauchmuskeln leicht anspannen.","15 Sekunden ohne Absetzen."],
  [2,"mittel",60,"Unterarmstütz","Halte einen sauberen Unterarmstütz (Plank) für 45 Sekunden.","Ruhig weiteratmen, Hüfte gerade halten.","45 Sekunden durchgehalten."],
  [2,"leicht",30,"Kopf und Bauch","Reibe kreisend den Bauch und klopfe gleichzeitig auf den Kopf. Nach 10 Sek. Hände wechseln.","Erst Bauch starten, dann Kopf dazunehmen.","Beide Bewegungen laufen flüssig."],
  [2,"leicht",30,"Rücken-Griff","Führe eine Hand von oben über die Schulter, die andere von unten hinter den Rücken – Fingerspitzen berühren.","Tief ausatmen beim Dehnen.","Fingerspitzen berühren sich."],
  [2,"mittel",45,"Wandsitzen","Sitze mit dem Rücken an der Wand im 90-Grad-Winkel für 40 Sekunden.","Hände nicht auf die Oberschenkel stützen.","40 Sekunden gehalten."],
  [2,"mittel",30,"Standwaage","Stehe auf einem Bein, Oberkörper vor, anderes Bein waagerecht nach hinten (10 Sek.).","Einen Punkt am Boden fixieren.","10 Sekunden stabil gehalten."],
  [2,"knacknuss",45,"Diamant-Liegestütze","Mache 8 Liegestütze, bei denen Daumen und Zeigefinger ein Dreieck unter der Brust bilden.","Ellbogen eng am Körper halten.","8 saubere Wiederholungen."],
  [2,"mittel",30,"Socken-Balance","Ziehe auf einem Bein stehend einen Socken aus und wieder an ohne Bodenkontakt.","Standbein leicht im Knie beugen.","Aus- und angezogen ohne Absetzen."],
  [2,"knacknuss",45,"Aufstehen ohne Hände","Setze dich in den Schneidersitz und stehe auf, ohne Hände oder Knie zu benutzen.","Oberkörper mit Schwung weit vorlehnen.","Sauberer Stand ohne Handeinsatz."],
  [2,"knacknuss",45,"Einbein-Kniebeuge","Mache auf einem Bein eine tiefe Kniebeuge und komme wieder hoch.","Arme als Gegengewicht nach vorne strecken.","Mindestens 90-Grad-Beugung geschafft."],
  [2,"leicht",30,"Waden-Stand","Stehe 20 Sekunden lang auf den Zehenspitzen mit geschlossenen Augen.","Fersen so hoch wie möglich drücken.","20 Sekunden ohne Fersenkontakt."],
  [2,"mittel",35,"20 Hampelmänner","Mache 20 saubere Hampelmänner in unter 20 Sekunden.","Arme oben ganz zusammenführen.","20 Stück in der Zeit."],
  [2,"leicht",25,"Zehen-Berührung","Beuge dich mit durchgestreckten Beinen nach vorne und berühre mit den Fingerspitzen deine Zehen (5 Sek.).","Langsam ausatmen beim Vorbeugen.","5 Sekunden gehalten."],
  [2,"mittel",40,"Bergsteiger","Mache 30 Sekunden lang schnelle 'Mountain Climbers' (Knie im Liegestütz abwechselnd zur Brust ziehen).","Schultern bleiben über den Händen.","30 Sekunden durchgehalten."],
  [2,"knacknuss",45,"Liegestütz-Klatsch","Mache 3 Liegestütze und klatsche bei jedem Hochdrücken einmal kurz in die Hände.","Explosiv nach oben abdrücken.","3 Klatsch-Liegestütze geschafft."],
  [2,"leicht",30,"Fersen-Sitz-Balance","Gehe in die tiefe Hocke auf die Zehenspitzen, löse die Hände vom Boden und halte das Gleichgewicht 15 Sekunden lang.","Arme locker nach vorne ausstrecken.","15 Sekunden ohne Umfallen gehalten."],
  [2,"mittel",45,"Liegestütz-Halten","Gehe in die Liegestütz-Position und senke den Körper bis auf 10 cm über den Boden ab. Halte diese Position 20 Sekunden lang.","Bauch und Gesäss fest anspannen.","20 Sekunden gehalten ohne abzulegen."],
  [2,"leicht",30,"Kreuz-Koordination","Berühre im Stehen abwechselnd mit dem rechten Ellbogen das linke Knie und mit dem linken Ellbogen das rechte Knie – 20 Mal flüssig.","Oberkörper leicht mitdrehen.","20 saubere Wiederholungen."],
  [2,"mittel",45,"Einbein-Sprünge","Hüpfe auf einem Bein 10 Mal im Kreis, wechsle in der Luft das Bein und hüpfe 10 Mal in die andere Richtung zurück.","Knie beim Landen immer leicht abfedern.","Alle 20 Sprünge ohne Absetzen des zweiten Fusses."],
  [2,"knacknuss",60,"Handstand-An-Der-Wand","Stelle dich mit dem Rücken zur Wand (oder nutze sie als Stütze) und halte einen Handstand für mindestens 10 Sekunden.","Hände schulterbreit aufsetzen, Blick zwischen die Hände.","10 Sekunden im Handstand gehalten."],
  [2,"leicht",30,"Nacken- und Schulter-Kreisen","Kreise die rechte Schulter nach vorne und gleichzeitig die linke Schulter nach hinten – 15 Sekunden lang.","Langsam starten, bis der Rhythmus sitzt.","Beide Schultern kreisen gegenläufig."],
  [2,"mittel",45,"Schiffchen-Bauchübung","Lege dich auf den Rücken, hebe gestreckte Beine und Schultern leicht vom Boden ab (Hohlkreuz vermeiden) und halte diese Spannung 30 Sekunden.","Unteren Rücken fest auf den Boden drücken.","30 Sekunden durchgehalten."],
  [2,"leicht",30,"Blind-Drehung","Schliesse die Augen, drehe dich auf der Stelle 3 Mal um die eigene Achse und bleibe sofort stocksteif auf einem Bein stehen (5 Sek.).","Nach der dritten Drehung kurz ausatmen und stabilisieren.","5 Sekunden auf einem Bein gestanden."],
  [2,"mittel",45,"Seitstütz","Stütze dich seitlich auf einem Unterarm ab, hebe die Hüfte an, sodass der Körper eine gerade Linie bildet, und halte dies 30 Sekunden.","Freien Arm nach oben strecken.","30 Sekunden stabile Linie gehalten."],
  [2,"knacknuss",60,"Burpee-Sprint","Mache 10 komplette Burpees (Hocke, Liegestütz-Position, Hocke, Strecksprung) in unter 35 Sekunden.","Gleichmässiges Tempo wählen, nicht zu schnell starten.","10 Burpees in unter 35 Sekunden."],
  [2,"leicht",30,"Handgelenk-Dehnung","Lege beide Handflächen vor der Brust zusammen (Gebetshaltung) und drücke die Hände langsam so tief nach unten, bis die Unterarme waagerecht sind (10 Sek.).","Handballen bleiben fest zusammen.","10 Sekunden ohne Lösen der Handballen."],
  [2,"mittel",45,"Ausfallschritt-Wechsel","Mache 16 gesprungene Ausfallschritte (im Sprung die Beine wechseln) mit aufrechtem Oberkörper.","Knie des hinteren Beins fast bis zum Boden absenken.","16 saubere Wechsel."],
  [2,"leicht",30,"Zehen-Greifer","Ziehe einen Socken aus und hebe ein Taschentuch oder einen Stift allein mit deinen Zehen vom Boden auf.","Gegenstand zwischen grossem und zweitem Zeh einklemmen.","Gegenstand erfolgreich hochgehoben."],
  [2,"mittel",45,"Brücke","Lege dich auf den Rücken, stelle die Füsse auf, setze die Hände neben den Ohren auf und drücke dich in eine volle Brücke hoch (10 Sek. halten).","Aus Beinen und Armen gleichzeitig nach oben drücken.","10 Sekunden in der Brücke gehalten."],
  [2,"knacknuss",60,"Liegestütz-Mit-Schultertipp","Gehe in den Liegestütz und tippe dir abwechselnd mit der rechten Hand auf die linke Schulter und umgekehrt – 16 Mal, ohne dass die Hüfte wackelt.","Füsse etwas breiter als schulterbreit aufstellen.","16 Wiederholungen mit ruhiger Hüfte."],
  [2,"leicht",30,"Storchen-Stand","Stelle die Fusssohle deines rechten Fusses an die Innenseite deines linken Knies, lege die Hände vor der Brust zusammen und halte das 20 Sekunden lang.","Fixiere einen ruhigen Punkt auf Augenhöhe an der Wand.","20 Sekunden stabil gehalten."],
  [2,"mittel",45,"Kniebeugen-Sprint","Mache 25 saubere Kniebeugen in unter 30 Sekunden. Die Oberschenkel müssen jeweils mindestens waagerecht sein.","Fersen fest auf dem Boden lassen und Arme beim Runtergehen nach vorne strecken.","25 Kniebeugen in unter 30 Sekunden."],
  [2,"leicht",30,"Schulter-Pass","Reiche einen Gegenstand (z.B. eine Wasserflasche oder ein Buch) 10 Mal hinter deinem Rücken und vor deinem Bauch um den Körper herum, ohne ihn zu berühren (nur mit den Händen).","Oberkörper aufrecht halten und nicht nach hinten schauen.","10 flüssige Runden ohne Berührung."],
  [2,"mittel",45,"Bärengang","Bewege dich auf Händen und Füssen (die Knie schweben knapp über dem Boden) einmal quer durch den Raum und wieder zurück.","Hüfte tief halten und diagonal (rechte Hand, linker Fuss) vorwärtsgehen.","Strecke komplett ohne Kniekontakt zum Boden absolviert."],
  [2,"knacknuss",60,"Liegestütz-Mit-Beinheben","Gehe in den Liegestütz und hebe im Wechsel für je 5 Sekunden ein gestrecktes Bein weit nach oben (4 Wechsel insgesamt).","Bauch fest anspannen, damit der untere Rücken nicht durchhängt.","Alle 4 Haltephasen sauber absolviert."],
  [2,"leicht",30,"Wadenheber-Tempo","Stelle dich hüftbreit hin und drücke dich 30 Mal hintereinander schnell auf die Zehenspitzen hoch, ohne dass die Fersen den Boden berühren.","Kurz an der Wand oder Stuhllehne mit einer Fingerspitze ausbalancieren.","30 Wiederholungen ohne Fersenkontakt."],
  [2,"mittel",45,"Rücken-Strecker (Superman)","Lege dich flach auf den Bauch, hebe gleichzeitig gestreckte Arme, Brustkorb und gestreckte Beine vom Boden ab und halte dies 25 Sekunden.","Blick nach unten zum Boden richten, damit der Nacken entspannt bleibt.","25 Sekunden in der Spannung gehalten."],
  [2,"leicht",30,"Daumen-Nase-Ohr-Wechsel","Greife mit der rechten Hand an deine Nase und mit der linken Hand überkreuz an dein rechtes Ohr. Klatsche in die Hände und wechsle sofort die Seiten – 10 Mal.","Nach jedem Klatschen kurz sortieren, dann Tempo steigern.","10 fehlerfreie Wechsel."],
  [2,"mittel",45,"Seiltänzer-Rückwärts","Gehe 10 Schritte exakt auf einer gedachten geraden Linie rückwärts, indem du immer die Zehenspitze direkt hinter die Ferse des anderen Fusses setzt.","Arme seitlich als Balancierstange ausbreiten.","10 Schritte ohne Gleichgewichtsverlust."],
  [2,"knacknuss",60,"Krähen-Pose (Yoga)","Gehe in die Hocke, setze die Hände schulterbreit auf den Boden, lege die Knie auf die Rückseite deiner Oberarme und hebe beide Füsse für 5 Sekunden vom Boden ab.","Blick nach vorne auf den Boden richten, nicht unter den Körper.","5 Sekunden frei auf den Händen balanciert."],
  [2,"leicht",30,"Achter-Kreisen","Kreise deine Hüfte 10 Mal in einer grossen liegenden Acht, während deine Schultern möglichst ruhig bleiben.","Knie leicht beugen für mehr Bewegungsfreiheit.","10 geschmeidige Achten gedreht."],
  [2,"mittel",45,"Käfer-Crunch","Lege dich auf den Rücken und führe 20 Mal abwechselnd den rechten Ellbogen zum linken Knie und umgekehrt, während das andere Bein gestreckt knapp über dem Boden schwebt.","Bewegung langsam und kontrolliert ausführen, nicht am Nacken ziehen.","20 saubere Wiederholungen."],
  [2,"leicht",30,"Blind-Kniebeuge","Schliesse die Augen, stelle dich auf ein Bein, mache eine halbe Kniebeuge und komme wieder hoch, ohne das zweite Bein abzusetzen (3 Mal).","Hände vor der Brust verschränken.","3 Wiederholungen mit geschlossenen Augen."],
  [2,"mittel",45,"Tisch-Position","Setze dich auf den Boden, stelle Hände und Füsse auf und drücke die Hüfte so hoch, dass Oberkörper und Oberschenkel eine waagerechte Tischplatte bilden. Halte dies 30 Sekunden.","Schultern weg von den Ohren drücken und Gesäss anspannen.","30 Sekunden waagerecht gehalten."],
  [2,"knacknuss",60,"Enger-Liegestütz-Slow","Mache 3 extrem langsame Liegestütze: 5 Sekunden kontrolliert absenken, 2 Sekunden unten halten, 5 Sekunden hochdrücken.","Ellbogen eng am Körper führen.","3 langsame Wiederholungen durchgehalten."],
  [2,"leicht",30,"Fuss-Alphabet","Hebe ein Bein leicht an und schreibe mit der Fussspitze die ersten 10 Buchstaben des Alphabets (A bis J) gross in die Luft.","Bewegung aus dem Fussgelenk und Unterschenkel führen.","Alle 10 Buchstaben sauber gezeichnet."],
  [2,"mittel",45,"Skater-Sprünge","Springe 20 Mal kraftvoll seitlich von einem Bein auf das andere (wie ein Eisschnellläufer), wobei das freie Bein hinter dem Standbein kreuzt.","Landung immer weich im Knie abfedern.","20 seitliche Sprünge absolviert."],
  [2,"leicht",30,"Schulterblatt-Quetscher","Strecke beide Arme seitlich auf Schulterhöhe aus und mache 25 kleine, schnelle Kreise nach hinten, ohne die Arme sinken zu lassen.","Daumen zeigen nach oben zur Decke.","25 Kreise auf Schulterhöhe."],
  [2,"mittel",45,"Einbein-Kreuzheben","Stehe auf einem Bein, beuge den Oberkörper mit geradem Rücken nach vorne, bis deine Fingerspitzen den Boden vor dem Standfuss berühren, und richte dich wieder auf (5 Mal).","Standbein minimal im Knie beugen.","5 Wiederholungen ohne Absetzen."],
  [2,"knacknuss",60,"Kommando-Plank","Wechsle 10 Mal flüssig vom Unterarmstütz in den hohen Liegestütz (erst rechter Arm hoch, linker Arm hoch, dann wieder runter).","Hüfte so ruhig wie möglich halten.","10 komplette Wechsel durchgehalten."],
  [2,"leicht",30,"Handgelenk-Welle","Verschränke die Finger beider Hände ineinander und mache 15 Sekunden lang eine flüssige Wellenbewegung durch beide Handgelenke.","Schultern locker hängen lassen.","15 Sekunden flüssige Welle."],
  [2,"mittel",45,"Hock-Streck-Sprünge","Mache 12 tiefe Kniebeugen mit anschliessendem explosivem Strecksprung nach oben.","Hände beim Sprung mit nach oben reissen.","12 Sprünge sauber absolviert."],
  [2,"leicht",30,"Knie-zu-Brust-Balance","Ziehe im Stehen ein Knie mit beiden Händen fest an die Brust und halte diese Position 15 Sekunden lang mit geschlossenen Augen.","Standbein komplett durchstrecken.","15 Sekunden ohne Wackeln gehalten."],
  [2,"mittel",45,"Krebsgang","Gehe rückwärts auf Händen und Füssen (Bauch zeigt nach oben zur Decke) einmal quer durch den Raum.","Hüfte hochhalten, damit das Gesäss nicht den Boden berührt.","Strecke komplett gemeistert."],
  [2,"knacknuss",60,"Wand-Handstand-Schultertipp","Gehe an der Wand in den Handstand (oder schräg an eine Couch/Wand gelehnt) und tippe dir 4 Mal abwechselnd mit einer Hand auf die gegenüberliegende Schulter.","Körperspannung voll aktivieren, bevor du eine Hand löst.","4 Schultertipps geschafft."],
  [2,"leicht",30,"Ohr-zu-Schulter-Dehnung","Neige den Kopf sanft zur rechten Seite, lege die rechte Hand locker auf das linke Ohr und halte die Dehnung 15 Sekunden (danach Seite wechseln).","Linke Schulter aktiv nach unten ziehen.","Beide Seiten je 15 Sekunden gedehnt."],
  [2,"mittel",45,"Russischer Twist","Setze dich auf den Boden, lehne den Oberkörper leicht zurück, hebe die Füsse an und drehe den Oberkörper 24 Mal abwechselnd nach links und rechts zum Boden.","Blick folgt den Händen bei jeder Drehung.","24 Drehungen mit angehobenen Füssen."],
  [2,"leicht",30,"Zehen-Fersen-Schaukel","Schaukle im Stand 20 Mal flüssig von den Zehenspitzen nach hinten auf die Fersen, ohne umzufallen.","Arme locker am Körper ausbalancieren.","20 Schaukelbewegungen ohne Ausfallschritt."],
  [2,"mittel",45,"Plank-Jacks","Gehe in den hohen Liegestütz und springe mit den Füssen 20 Mal wie beim Hampelmann auseinander und wieder zusammen.","Schultern bleiben direkt über den Handgelenken.","20 Wiederholungen durchgehalten."],
  [2,"knacknuss",60,"L-Sitz-Versuch","Setze dich mit gestreckten Beinen auf den Boden, setze die Hände neben der Hüfte auf und drücke deinen gesamten Körper inklusive Beinen für 5 Sekunden vom Boden hoch.","Schultern kräftig nach unten drücken und Bauch anspannen.","5 Sekunden komplett vom Boden abgehoben."],
  [2,"leicht",30,"Finger-Spitzen-Liegestütz-Wand","Stelle dich eine Armlänge vor eine Wand und mache 10 Liegestütze gegen die Wand – aber nur auf deinen Fingerspitzen!","Finger leicht spreizen und stabil halten.","10 Wiederholungen geschafft."],
  [2,"mittel",45,"Ausfallschritt-Hold","Mache einen grossen Ausfallschritt nach vorne, senke das hintere Knie bis 3 cm über den Boden ab und halte diese Position 25 Sekunden.","Oberkörper aufrecht halten, vorderes Knie bleibt über dem Knöchel.","25 Sekunden gehalten."],
  [2,"leicht",30,"Kopf-Buch-Kniebeuge","Lege ein geschlossenes Buch flach auf deinen Kopf und mache 5 tiefe Kniebeugen, ohne dass das Buch herunterfällt.","Rücken gerade halten und nach vorne schauen.","5 Kniebeugen mit Buch auf dem Kopf."],
  [2,"mittel",45,"Flutter-Kicks","Lege dich auf den Rücken, Hände unter das Gesäss, hebe die gestreckten Beine 15 cm an und mache 30 Sekunden lang schnelle Paddelbewegungen.","Unteren Rücken fest auf die Unterlage drücken.","30 Sekunden durchgehalten."],
  [2,"knacknuss",60,"Einarmiger-Plank","Gehe in den Unterarmstütz, stelle die Füsse etwas breiter auf, löse einen Arm und strecke ihn nach vorne aus. Halte dies 15 Sekunden pro Seite.","Hüfte parallel zum Boden halten, nicht aufdrehen.","Je 15 Sekunden pro Arm gehalten."],
  [2,"leicht",30,"Einbein-Drehung","Stehe auf einem Bein und drehe deinen Kopf 10 Mal langsam ganz nach links und ganz nach rechts, ohne das Gleichgewicht zu verlieren.","Fixiere am Ende jeder Kopfdrehung kurz einen Punkt mit den Augen.","10 Kopfdrehungen ohne Absetzen des Fusses."],
  [2,"mittel",45,"Wandsitz-Einbeinig","Gehe in den 90-Grad-Wandsitz und strecke ein Bein für 15 Sekunden waagerecht nach vorne aus. Danach Bein wechseln und nochmals 15 Sekunden halten.","Unteren Rücken fest gegen die Wand pressen.","Je 15 Sekunden pro Bein durchgehalten."],
  [2,"leicht",30,"Zehen-Spreizer","Ziehe beide Socken aus und spreize alle zehn Zehen so weit wie möglich auseinander. Halte diese Spannung 10 Sekunden lang.","Konzentriere dich besonders auf die kleinen Zehen.","Alle Zehen sichtbar gespreizt und 10 Sek. gehalten."],
  [2,"mittel",45,"Liegestütz-Mit-Drehung (T-Plank)","Mache einen Liegestütz und drehe dich danach in den Seitstütz auf, indem du einen Arm senkrecht zur Decke streckst. 8 Wiederholungen im Wechsel.","Blick folgt der nach oben gestreckten Hand.","8 saubere Wiederholungen."],
  [2,"knacknuss",60,"Pistol-Squat-Hold","Gehe auf einem Bein so tief wie möglich in die Hocke (das andere Bein ist gestreckt nach vorne) und halte die unterste Position 10 Sekunden.","Arme weit nach vorne ausstrecken als Gegengewicht.","10 Sekunden unten gehalten ohne umzufallen."],
  [2,"leicht",30,"Arm-Pendel-Gegengleich","Schwinge den rechten Arm vorwärts im Kreis und gleichzeitig den linken Arm rückwärts im Kreis – 15 Sekunden lang.","Beide Arme treffen sich oben und unten gleichzeitig.","15 Sekunden flüssig gegenläufig gekreist."],
  [2,"mittel",45,"Brücken-Marsch","Gehe in die umgekehrte Tisch- oder Brückenposition (Bauch zeigt nach oben) und hebe im Wechsel 16 Mal ein Knie Richtung Brust.","Hüfte bleibt dabei weit oben.","16 Wiederholungen ohne Absinken der Hüfte."],
  [2,"leicht",30,"Fersen-Kuss","Springe aus dem Stand leicht hoch und schlage in der Luft zweimal deine Fersen zusammen, bevor du wieder landest (5 Mal).","Leicht nach vorne beugen und Füsse hochziehen.","5 Mal zweimaliges Klatschen der Fersen gehört."],
  [2,"mittel",45,"Ausfallschritt-Drehung","Mache einen tiefen Ausfallschritt nach vorne und drehe deinen Oberkörper 12 Mal kontrolliert weit nach links und rechts.","Knie des vorderen Beins bleibt stabil und wackelt nicht zur Seite.","12 kontrollierte Drehungen."],
  [2,"knacknuss",60,"Handstand-Abrollen-oder-Halten","Stelle dich auf die Hände (gerne mit den Füssen an der Wand abgestützt) und berühre mit einem Fuss kurz die gegenüberliegende Kniekehle (5 Sek. pro Seite).","Körperspannung im Rumpf voll halten.","Je 5 Sekunden einbeinig an der Wand balanciert."],
  [2,"leicht",30,"Schulter-Brücke","Lege dich auf den Rücken, stelle die Füsse auf, hebe das Becken weit an und halte diese Spannung 25 Sekunden lang.","Gesässmuskeln oben fest zusammendrücken.","25 Sekunden gehalten."],
  [2,"mittel",45,"Kniebeuge-Mit-Fersenheben","Gehe in eine tiefe Kniebeuge, hebe unten beide Fersen vom Boden ab (Balance auf den Zehenballen) und halte dies 15 Sekunden.","Arme als Ausgleich nach vorne strecken.","15 Sekunden auf den Zehenballen in der Hocke gehalten."],
  [2,"leicht",30,"Nacken-Uhr","Stelle dir vor, deine Nasenspitze ist ein Stift, und zeichne damit 5 grosse, langsame Kreise rechtsherum und 5 linksherum in die Luft.","Schultern locker nach unten hängen lassen.","Je 5 ruhige Kreise in beide Richtungen."],
  [2,"mittel",45,"Liegestütz-Froschsprung","Gehe in den hohen Liegestütz und springe 12 Mal mit beiden Füssen gleichzeitig aussen neben deine Hände und wieder zurück.","Hände bleiben fest am Boden kleben.","12 saubere Wiederholungen."],
  [2,"knacknuss",60,"Einarm-Einbein-Plank","Gehe in den hohen Liegestütz und hebe gleichzeitig den rechten Arm und das linke Bein waagerecht an. Halte dies 10 Sekunden, dann Seite wechseln.","Blick zum Boden richten und Bauch anspannen.","Je 10 Sekunden diagonal gehalten."],
  [2,"leicht",30,"Storch-Mit-Armkreisen","Stehe auf einem Bein und mache mit beiden ausgestreckten Armen 15 kleine, schnelle Kreise, ohne abzusetzen.","Standbein minimal im Knie entriegeln.","15 Kreise auf einem Bein geschafft."],
  [2,"mittel",45,"V-Sit-Hold","Setze dich auf den Boden, hebe Oberkörper und gestreckte Beine so an, dass dein Körper ein 'V' bildet, und halte dies 25 Sekunden lang freihändig.","Rücken möglichst gerade halten, nicht einrunden.","25 Sekunden in V-Form gehalten."],
  [2,"leicht",30,"Fuss-Klavier","Setze dich auf einen Stuhl und bewege alle zehn Zehen 15 Sekunden lang wie beim Klavierspielen unabhängig voneinander auf und ab.","Fersen bleiben fest auf dem Boden stehen.","15 Sekunden deutliche Zehenbewegung."],
  [2,"mittel",45,"Seitsprung-Linie","Lege einen Stift oder ein Band auf den Boden und springe beidbeinig 30 Mal so schnell wie möglich seitlich darüber hin und her.","Nur aus den Fussgelenken abspringen, Knie leicht gebeugt.","30 Sprünge in unter 25 Sekunden."],
  [2,"knacknuss",60,"Tiefer-Liegestütz-Hold","Senke dich im Liegestütz ab, bis deine Brust nur noch 3 cm über dem Boden schwebt, und halte diese Position 20 Sekunden lang.","Ellbogen eng am Körper halten und ruhig weiteratmen.","20 Sekunden knapp über dem Boden gehalten."],
  [2,"leicht",30,"Hand-Fuss-Gleichschritt","Marschiere auf der Stelle und führe dabei immer den RECHTEN Arm mit dem RECHTEN Bein gleichzeitig nach vorne (Passgang) – 20 Schritte flüssig.","Konzentriere dich bewusst darauf, das normale Kreuzmuster zu unterdrücken.","20 Schritte sauber im Passgang."],
  [2,"mittel",45,"Sumo-Kniebeuge-Puls","Stelle die Füsse sehr breit auf (Zehenspitzen zeigen nach aussen), gehe tief in die Hocke und mache 25 kleine Wipp-Bewegungen ganz unten.","Oberkörper bleibt komplett aufrecht.","25 kleine Impulse tief unten."],
  [2,"leicht",30,"Augen-Zu-Baum","Stelle deinen Fuss an die Innenseite des anderen Oberschenkels (oder Knies), schliesse die Augen und halte diese Yoga-Baum-Pose 15 Sekunden.","Hände vor dem Herzen zusammenlegen.","15 Sekunden blind balanciert."],
  [2,"mittel",45,"Hüft-Tipper-Im-Plank","Gehe in den Unterarmstütz und senke deine Hüfte 20 Mal abwechselnd links und rechts bis kurz vor den Boden ab.","Schultern bleiben stabil über den Ellbogen.","20 saubere Hüft-Tipps."],
  [2,"knacknuss",60,"Kopfstand-Versuch","Mache einen Kopfstand an der Wand (oder auf einem Kissen/Teppich) und halte die Beine für mindestens 10 Sekunden senkrecht nach oben.","Hände und Kopf bilden ein stabiles gleichseitiges Dreieck.","10 Sekunden senkrecht gehalten."],
  [2,"leicht",30,"Schulter-Zucken-Tempo","Ziehe beide Schultern 25 Mal so hoch wie möglich zu den Ohren und lasse sie sofort wieder fallen – in unter 15 Sekunden.","Arme hängen dabei völlig entspannt nach unten.","25 Wiederholungen in der Zeit."],
  [2,"mittel",45,"Rücken-Engel","Lege dich flach auf den Bauch, hebe Brustkorb und Arme leicht an und führe die gestreckten Arme 12 Mal wie beim Schneeengel von vorne nach hinten neben die Hüfte.","Daumen zeigen während der ganzen Bewegung nach oben.","12 Wiederholungen ohne Bodenkontakt der Hände."],
  [2,"leicht",30,"Einbein-Tipp-Uhr","Stehe auf einem Bein und tippe mit der Spitze des anderen Fusses weit nach vorne (12 Uhr), zur Seite (3/9 Uhr) und nach hinten (6 Uhr) – 4 Runden.","Standbein trägt das gesamte Gewicht, Spielbein tippt nur sanft.","4 komplette Runden ohne Absetzen."],
  [2,"mittel",45,"Liegestütz-Breit-Eng","Mache 8 Liegestütze im Wechsel: einen mit sehr breiter Handstellung, den nächsten mit schulterbreiter Handstellung.","Rumpf bleibt wie ein Brett gespannt.","8 saubere Wechsel-Liegestütze."],
