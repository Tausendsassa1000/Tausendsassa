  [4,"mittel",35,"Finger-Schrift","Ein Mitspieler schreibt mit dem Finger 3 Grossbuchstaben auf deinen Rücken. Errate alle 3.","Konzentriere dich auf Start- und Endpunkt.","Alle 3 Buchstaben erkannt."],
  [4,"leicht",30,"Farben-Zähler","Schau dich 10 Sek. um, schliesse die Augen und sage, wie viele Personen hier Brillen oder Uhren tragen.","Zähle systematisch im Kreis.","Exakte Anzahl genannt."],
  [4,"mittel",40,"Temperatur-Check","Berühre mit geschlossenen Augen 3 Oberflächen (Holz, Metall, Stoff) und ordne sie von kalt nach warm.","Metall leitet Wärme am schnellsten ab.","Richtige Reihenfolge."],
  [4,"knacknuss",45,"Stimmen-Imitator","Schliesse die Augen. Zwei Mitspieler sagen denselben Satz mit verstellter Stimme. Erkenne beide.","Achte auf Sprachmelodie und Atem.","Beide Personen erkannt."],
  [4,"leicht",30,"Takt-Zähler","Schliesse die Augen. Der Vorleser klopft 15 Sekunden lang in unregelmässigem Tempo mit einem Stift auf den Tisch. Zähle im Kopf mit und nenne am Ende die exakte Anzahl der Schläge.","Zähle in Dreier- oder Fünfergruppen mit, um nicht durcheinanderzukommen.","Exakte Anzahl der Klopfschläge genannt (Toleranz: +/- 1)."],
  [4,"mittel",45,"Gewichts-Sortierer","Schliesse die Augen. Der Vorleser legt dir nacheinander 4 verschiedene Gegenstände in die Hand (z. B. Handy, Schlüsselbund, Löffel, Buch). Bringe sie danach blind von leicht nach schwer in die richtige Reihenfolge.","Wiege je zwei Gegenstände kurz nacheinander in derselben Hand ab.","Alle 4 Gegenstände korrekt von leicht nach schwer sortiert."],
  [4,"leicht",30,"Geräusch-Detektiv","Schliesse die Augen. Der Vorleser erzeugt nacheinander 3 Geräusche mit Dingen im Raum (z. B. Reisverschluss öffnen, Blatt knüllen, Glas abstellen). Errate alle 3.","Achte auf das Material (Metall, Papier, Stoff, Glas).","Alle 3 Geräusche richtig benannt."],
  [4,"mittel",45,"15-Sekunden-Punktlandung","Schliesse die Augen und sage exakt nach 15 Sekunden 'Stopp' – während alle Mitspieler laut bis 20 zählen, aber absichtlich viel zu schnell oder zu langsam!","Ignoriere die Stimmen und konzentriere dich nur auf deinen ruhigen Herzschlag.","Abweichung maximal 1,5 Sekunden (13,5 bis 16,5 Sek.)."],
  [4,"knacknuss",60,"Blind-Zeichnung-Nachzeichnen","Schliesse die Augen. Ein Mitspieler malt mit dem Finger eine einfache Figur (z. B. Haus, Stern oder Baum) auf deine Handfläche. Zeichne diese Figur danach blind auf ein Blatt Papier.","Merke dir genau, wo die Linien beginnen und wo Richtungswechsel stattfinden.","Erkennbare Figur gezeichnet."],
  [4,"leicht",30,"Seiten-Check","Schliesse sofort die Augen! Was hat dein rechter Sitznachbar genau an (Pulloverfarbe, Hose/Rock, Socken/Schuhe, Schmuck/Uhr)? Nenne 4 korrekte Details.","Gehe im Geist von den Schultern bis zu den Füssen.","Mindestens 4 zutreffende Details genannt."],
  [4,"mittel",45,"Papier-Dicken-Test","Schliesse die Augen. Der Vorleser gibt dir ein einzelnes Blatt Papier, danach zwei zusammengelegte Blätter und danach ein gefaltetes Blatt. Erkenne blind, wie viele Lagen es jeweils sind.","Reibe das Papier sanft zwischen Daumen und Zeigefinger.","Alle 3 Lagen-Anzahlen richtig erkannt."],
  [4,"leicht",30,"Echo-Klatschen","Der Vorleser klatscht 3 verschiedene, kurze Rhythmen vor. Klatsche jeden Rhythmus sofort im exakt gleichen Tempo und der gleichen Lautstärke nach.","Achte besonders auf die Pausen zwischen den Klatschern.","Alle 3 Rhythmen sauber imitiert."],
  [4,"mittel",45,"Wort-Lücken-Hören","Der Vorleser liest einen bekannten Satz oder Liedtext vor und lässt dabei 3 einzelne Wörter weg, indem er kurz summt. Nenne alle 3 fehlenden Wörter.","Höre auf den Sinn und den Rhythmus des Satzes.","Alle 3 ausgelassenen Wörter richtig ergänzt."],
  [4,"knacknuss",60,"Geschmacks- oder Duft-Zwillingsprobe","Schliesse die Augen. Der Vorleser hält dir zweimal hintereinander ein Glas oder eine Schüssel unter die Nase (entweder zweimal dasselbe oder zwei verschiedene Dinge). Erkenne, ob es identisch ist, und benenne den Duft.","Zwischen beiden Proben einmal neutral durch den Mund ausatmen.","Gleichheit/Unterschied erkannt und mindestens einen Duft benannt."],
  [4,"leicht",30,"Entfernungs-Schätzer-Schritt","Schau dir ein Ziel im Raum an (z. B. die Tür oder ein Stuhlbein), schliesse die Augen und gehe exakt so viele Schritte darauf zu, bis du glaubst, genau 30 cm davor zu stehen.","Merke dir vor dem Augenschliessen die Anzahl deiner normalen Schritte.","Du stehst maximal 30 cm vom Ziel entfernt, ohne es anzurempeln."],
  [4,"mittel",45,"Handflächen-Leser","Schliesse die Augen. Jeder Mitspieler legt nacheinander kurz seine flache Hand auf deine geöffnete Hand. Errate allein an Grösse, Wärme und Hautstruktur, wer wer ist.","Achte auf Fingerlänge, Ringe/Uhren (vorher abnehmen!) und Handtemperatur.","Alle Mitspieler richtig zugeordnet."],
  [4,"leicht",30,"Raum-Uhrzeiger","Schliesse sofort die Augen! Der Vorleser nennt 4 Gegenstände im Raum (z. B. Fenster, Lampe, Couch, Tür). Zeige jeweils sofort mit ausgestrecktem Arm exakt in die richtige Richtung.","Orientiere dich an deiner Sitzposition am Tisch.","Alle 4 Richtungen sofort richtig gezeigt."],
  [4,"mittel",45,"Zahlen-Rücken-Schrift","Schliesse die Augen. Ein Mitspieler schreibt dir eine dreistellige Zahl (z. B. 482) gross mit dem Finger auf den Rücken. Nenne die exakte Zahl.","Stelle dir die Ziffern wie auf einem grossen Bildschirm vor.","Alle 3 Ziffern in der richtigen Reihenfolge genannt."],
  [4,"knacknuss",60,"Doppel-Geräusch-Filter","Zwei Mitspieler sagen gleichzeitig zwei verschiedene einfache Wörter (z. B. 'Apfel' und 'Wolke'). Wiederhole beide Wörter sofort fehlerfrei (3 Durchgänge).","Konzentriere dich auf beide Stimmen gleichzeitig, ohne eine auszublenden.","Mindestens 2 von 3 Durchgängen komplett richtig."],
  [4,"leicht",30,"Stift-Längen-Schätzer","Schliesse die Augen. Der Vorleser legt dir einen Stift in die Hand. Schätze seine genaue Länge in Zentimetern (ein normaler Kugelschreiber hat ca. 14 cm).","Nutze die Breite deiner vier Finger (ca. 7–8 cm) als Vergleichsmass.","Abweichung maximal 2 Zentimeter."],
  [4,"mittel",45,"Tempo-Verdoppler","Der Vorleser klopft 5 Sekunden lang ein langsames, gleichmässiges Tempo vor. Klopfe danach 10 Sekunden lang exakt im DOPPELT so schnellen Takt weiter.","Teile jeden Schlag des Vorlesers im Kopf in genau zwei gleichmässige Hälften.","Doppeltes Tempo sauber gehalten."],
  [4,"leicht",30,"Kalt-Warm-Fühler","Schliesse die Augen. Der Vorleser berührt deinen Handrücken nacheinander mit 3 verschiedenen Gegenständen (z. B. Metalllöffel, Holzkochlöffel, Stoffserviette). Benenne das Material.","Metall fühlt sich sofort kühl an, Stoff warm und weich.","Alle 3 Materialien richtig erkannt."],
  [4,"mittel",45,"45-Sekunden-Stille","Die gesamte Gruppe ist komplett still. Du schliesst die Augen und sagst 'Stopp', wenn du glaubst, dass exakt 45 Sekunden vergangen sind.","Atme ruhig und zähle deine Atemzüge (ein ruhiger Atemzug dauert ca. 4–5 Sek.).","Abweichung maximal 3,5 Sekunden (41,5 bis 48,5 Sek.)."],
  [4,"knacknuss",60,"Blind-Münzen-Summe","Schliesse die Augen. Der Vorleser legt dir 3 verschiedene Münzen in die Hand. Ertaste ihren Wert und nenne innerhalb von 20 Sekunden die exakte Gesamtsumme.","Prüfe zuerst Grösse und Dicke jeder einzelnen Münze im Vergleich.","Exakte Gesamtsumme richtig berechnet."],
  [4,"leicht",30,"Blick-Gedächtnis-Tisch","Schau dir den Tisch vor dir 10 Sekunden lang genau an und schliesse dann die Augen. Nenne 8 Gegenstände, die gerade auf dem Tisch liegen.","Scanne den Tisch im Geist von links nach rechts ab.","8 tatsächlich vorhandene Gegenstände genannt."],
  [4,"mittel",45,"Flüster-Wort-Test","Ein Mitspieler steht mindestens 3 Meter entfernt und flüstert ein einzelnes Wort (ohne Ton, nur gehaucht). Wiederhole das Wort richtig (3 Versuche mit verschiedenen Wörtern).","Schliesse die Augen, um das Gehör maximal zu schärfen.","Mindestens 2 von 3 geflüsterten Wörtern richtig verstanden."],
  [4,"leicht",30,"Schlüssel-Erkenner","Schliesse die Augen. Der Vorleser gibt dir einen Schlüsselbund mit mehreren Schlüsseln. Finde allein durch Fühlen den kleinsten und den grössten Schlüssel heraus.","Fahre mit dem Daumen über alle Schlüsselköpfe gleichzeitig.","Kleinsten und grössten Schlüssel richtig gezeigt."],
  [4,"mittel",45,"Rhythmus-Lücke","Der Vorleser klopft eine bekannte Liedmelodie (z. B. 'Happy Birthday' oder 'Alle meine Entchen') auf den Tisch, hört aber mitten im Lied auf. Klopfe oder summe das Lied sofort im richtigen Tempo weiter.","Steige direkt ohne Pause im exakt gleichen Takt ein.","Richtiger Einsatz und richtiges Tempo getroffen."],
  [4,"knacknuss",60,"Spiegel-Tast-Rätsel","Schliesse die Augen. Ein Mitspieler formt mit seinen Händen eine bestimmte Pose (z. B. Victory-Zeichen, Faust, Daumen hoch). Ertaste seine Hand mit deinen Händen und baue exakt dieselbe Pose mit deiner eigenen Hand nach (3 Runden).","Fühle systematisch vom Handgelenk bis zu jedem einzelnen Finger.","Alle 3 Handposen exakt nachgebildet."],
  [4,"leicht",30,"Geräusch-Richtung","Schliesse die Augen. Ein Mitspieler bewegt sich leise im Raum und klatscht an 4 verschiedenen Positionen (links, rechts, vorne, hinten). Zeige jeweils sofort dorthin.","Kopf ganz ruhig halten, damit beide Ohren den Zeitunterschied messen können.","Alle 4 Positionen sofort richtig gezeigt."],
  [4,"mittel",45,"Flaschen-Füllstand-Hören","Schliesse die Augen. Der Vorleser klopft mit einem Löffel nacheinander an 3 unterschiedlich gefüllte Gläser oder Flaschen. Ordne sie allein am Klang von leer nach voll.","Je mehr Wasser im Glas ist, desto tiefer klingt der Ton.","Richtige Reihenfolge von leer nach voll."],
  [4,"leicht",30,"Stoff-Detektiv","Schliesse die Augen. Ertaste 3 verschiedene Kleidungsstücke oder Stoffe im Raum (z. B. Jeans, Wolle, Baumwolle) und benenne das Material.","Reibe den Stoff sanft zwischen Daumen und Zeigefinger.","Alle 3 Materialien richtig erkannt."],
  [4,"mittel",45,"20-Sekunden-Rückwärts","Schliesse die Augen und sage 'Stopp', wenn genau 20 Sekunden vergangen sind – während du gleichzeitig im Kopf von 50 in 3er-Schritten rückwärts zählst (50, 47, 44...).","Lass dich vom Rechnen nicht hetzen, halte einen ruhigen Sprechrhythmus.","Abweichung maximal 2 Sekunden (18,0 bis 22,0 Sek.)."],
  [4,"knacknuss",60,"Blind-Gesichts-Scanner","Schliesse die Augen. Ertaste vorsichtig die Hände (oder Arme/Uhren) von zwei Mitspielern und finde heraus, wer von beiden vor dir steht.","Achte auf Handgrösse, Fingerform und Hautstruktur.","Beide Personen richtig identifiziert."],
  [4,"leicht",30,"Schatten-Grösse","Schau dir einen Gegenstand auf dem Tisch an (z. B. eine Tasse) und zeige mit deinen beiden Händen in der Luft genau seine Breite und Höhe an, nachdem du die Augen geschlossen hast.","Fixiere vor dem Augenschliessen die Aussenkanten des Gegenstands.","Abweichung maximal 2 cm in Breite und Höhe."],
  [4,"mittel",45,"Wort-Zähler","Der Vorleser liest einen kurzen Absatz (ca. 25 Wörter) vor. Zähle im Kopf mit, wie oft der Buchstabe 'A' oder das Wort 'und' vorkommt.","Tippe bei jedem Treffer unauffällig mit einem Finger aufs Bein.","Exakte Anzahl genannt (Toleranz: +/- 1)."],
  [4,"leicht",30,"Temperatur-Unterschied","Schliesse die Augen. Der Vorleser hält deine Handfläche nacheinander über eine warme Tasse (oder Hand) und einen kühlen Gegenstand. Erkenne sofort, was wärmer ist (3 Durchgänge).","Handfläche ruhig halten und auf Wärmestrahlung achten.","Alle 3 Durchgänge richtig erkannt."],
  [4,"mittel",45,"Takt-Halbierer","Der Vorleser klopft 6 Sekunden lang ein schnelles Tempo vor. Klopfe danach 10 Sekunden lang exakt im HALB so schnellen Takt weiter.","Lasse jeweils jeden zweiten Schlag des Vorlesers im Kopf aus.","Halbes Tempo sauber durchgehalten."],
  [4,"knacknuss",60,"Blind-Puzzler","Schliesse die Augen. Der Vorleser gibt dir 4 verschiedene Münzen oder Spielkarten in die Hand, die jeweils anders herum liegen (Kopf/Zahl bzw. Vorder-/Rückseite). Bringe alle 4 blind auf dieselbe Seite.","Fühle bei Münzen nach dem erhabenen Rand und der Prägung; bei Karten nach der glatten Beschichtung.","Alle 4 Teile liegen auf der gleichen Seite."],
  [4,"leicht",30,"Augen-Zu-Farben","Schliesse sofort die Augen! Welche Farbe haben die Socken (oder Schuhe) deines linken Sitznachbarn und welche Farbe hat die Zimmerdecke/Wand hinter dir?","Erinnere dich an deinen letzten Blick beim Hinsetzen.","Beide Farben korrekt genannt."],
  [4,"mittel",45,"Geräusch-Memory","Schliesse die Augen. Der Vorleser erzeugt eine Kette aus 4 Geräuschen (z. B. Klatschen, Schnipsen, Pfeifen, Klopfen). Wiederhole die Geräuschkette in exakt derselben Reihenfolge (2 Runden).","Merke dir die Geräusche als Wörter im Kopf.","Beide Runden fehlerfrei wiederholt."],
  [4,"leicht",30,"Papier-Grössen-Test","Schliesse die Augen. Der Vorleser gibt dir ein normales A4-Blatt und ein gefaltetes kleineres Blatt. Halbiere das grosse Blatt blind durch Falten so exakt wie möglich.","Lege Ecke auf Ecke und fühle mit den Fingern, ob die Ränder bündig sind.","Sauber in der Mitte gefaltet (Abweichung max. 5 mm)."],
  [4,"mittel",45,"Puls-Fühler","Finde ohne Hilfe innerhalb von 20 Sekunden deinen eigenen Puls am Handgelenk oder Hals und klopfe ihn 10 Sekunden lang mit dem Finger im exakten Rhythmus auf den Tisch.","Lege Zeige- und Mittelfinger sanft seitlich unter den Kieferknochen.","Gleichmässiger Puls-Rhythmus geklopft."],
  [4,"knacknuss",60,"Doppel-Tast-Test","Schliesse die Augen. Der Vorleser drückt dir gleichzeitig in die linke Hand und in die rechte Hand je einen verschiedenen Alltagsgegenstand. Benenne beide innerhalb von 4 Sekunden.","Arbeite mit beiden Händen gleichzeitig, statt nacheinander.","Beide Gegenstände in unter 4 Sekunden erkannt."],
  [4,"leicht",30,"Stimmen-Erkenner","Schliesse die Augen. Ein Mitspieler sagt nur ein einziges Wort ('Hallo') mit absichtlich verstellter Stimme (hoch oder tief). Errate, wer es war (3 Runden).","Achte auf den Tonfall und die Aussprache der Vokale.","Mindestens 2 von 3 Personen richtig erraten."],
  [4,"mittel",45,"Gewichts-Zwilling","Schliesse die Augen. Du bekommst in die linke Hand einen Gegenstand (z. B. ein Handy). Suche mit der rechten Hand blind auf dem Tisch nach einem Gegenstand, der ungefähr gleich schwer ist.","Wiege beide Hände wie eine Balkenwaage gleichzeitig auf und ab.","Gewichtsunterschied der beiden Gegenstände liegt unter 30 %."],
  [4,"leicht",30,"Linien-Länge","Zeichne mit geschlossenen Augen auf ein Blatt Papier eine gerade Linie, die exakt 10 Zentimeter lang ist. Danach wird mit dem Lineal nachgemessen.","Nutze die Breite deines Zeigefingers (ca. 1,5 cm) als Schätzhilfe.","Toleranz: 8,5 cm bis 11,5 cm."],
  [4,"mittel",45,"Wort-Rückwärts-Hören","Der Vorleser buchstabiert ein 6-buchstabiges Wort rückwärts (z. B. 'N-E-T-R-A-G' für GARTEN). Nenne das richtige Wort innerhalb von 10 Sekunden (2 Wörter).","Schreibe die gehörten Buchstaben im Geist von rechts nach links auf.","Beide Wörter richtig erkannt."],
  [4,"knacknuss",60,"35-Sekunden-Gefühl","Schliesse die Augen und sage 'Stopp', wenn exakt 35 Sekunden vergangen sind – während ein Mitspieler dich leicht am Arm antippt, um dich aus dem Takt zu bringen.","Konzentriere dich auf deine gleichmässige Atmung.","Abweichung maximal 2,5 Sekunden (32,5 bis 37,5 Sek.)."],
  [4,"leicht",30,"Oberflächen-Check","Schliesse die Augen. Der Vorleser führt deinen Zeigefinger über 3 verschiedene Oberflächen (z. B. Holz, Glas, Papier, Leder). Benenne alle 3 sofort.","Achte auf Reibungswiderstand und Temperatur der Oberfläche.","Alle 3 Oberflächen richtig erkannt."],
  [4,"mittel",45,"Fehlender-Ton","Der Vorleser singt oder summt die Tonleiter (Do-Re-Mi-Fa-So-La-Ti-Do), lässt aber einen Ton absichtlich aus. Nenne die Position des fehlenden Tons (z. B. der 5. Ton).","Singe die Tonleiter innerlich parallel mit.","Fehlende Position richtig erkannt (2 Durchgänge)."],
  [4,"leicht",30,"Blick-Winkel-Schätzer","Schau zur Zimmerdecke und zeige mit ausgestrecktem Arm exakt in einem 45-Grad-Winkel schräg nach oben (Mitte zwischen waagerecht und senkrecht).","Stelle dir ein Quadrat vor und zeige genau auf die diagonale Ecke.","Winkel liegt erkennbar bei ca. 45 Grad (Toleranz: +/- 10 Grad)."],
  [4,"mittel",45,"Schlüssel-Klappern","Schliesse die Augen. Der Vorleser lässt einmal einen Schlüsselbund und einmal eine einzelne Münze auf den Tisch fallen (3 Durchgänge). Unterscheide das Geräusch sofort.","Achte auf das Nachklingen von mehreren Metallteilen.","Alle 3 Durchgänge richtig unterschieden."],
  [4,"knacknuss",60,"Blind-Kreis-Schluss","Schliesse die Augen und zeichne auf ein Blatt Papier einen möglichst runden Kreis, dessen Endlinie genau wieder den Anfangspunkt trifft, ohne zu überkreuzen.","Lasse den kleinen Finger der Zeichenhand als Zirkel-Mittelpunkt auf dem Papier ruhen.","Kreis ist erkennbar rund und der Abstand zwischen Start und Ende ist kleiner als 5 mm."],
  [4,"leicht",30,"Takt-Nachklatscher","Der Vorleser klatscht 4 verschiedene Rhythmen vor, die jeweils aus schnellen und langsamen Schlägen bestehen. Wiederhole alle 4 fehlerfrei.","Zähle die Pausen zwischen den Schlägen innerlich mit.","Alle 4 Rhythmen exakt imitiert."],
  [4,"mittel",45,"Gewichts-Vergleich-Münzen","Schliesse die Augen. Der Vorleser legt dir nacheinander eine kleine Münze und zwei aufeinandergelegte Münzen in die Hand (3 Durchgänge). Erkenne sofort, ob es eine oder zwei sind.","Achte auf die Dicke am Rand und das leichte Klirren beim Bewegen.","Alle 3 Durchgänge richtig erkannt."],
  [4,"leicht",30,"Geräusch-Anzahl","Schliesse die Augen. Der Vorleser lässt innerhalb von 10 Sekunden mehrere kleine Gegenstände (z. B. Münzen oder Stifte) nacheinander auf den Tisch fallen. Nenne die exakte Anzahl.","Höre genau hin, ob zwei Teile gleichzeitig aufkommen.","Exakte Anzahl richtig gezählt."],
  [4,"mittel",45,"25-Sekunden-Gefühl","Schliesse die Augen und sage 'Stopp', wenn du glaubst, dass exakt 25 Sekunden vergangen sind – während du gleichzeitig deine Finger abwechselnd bewegst.","Zähle im ruhigen Sekundentakt 'einundzwanzig, zweiundzwanzig...'.","Abweichung maximal 2 Sekunden (23,0 bis 27,0 Sek.)."],
  [4,"knacknuss",60,"Blind-Labyrinth-Stift","Ein Mitspieler zeichnet zwei parallele Wellenlinien (Abstand ca. 2 cm) auf ein Blatt. Schau sie dir 5 Sekunden an, schliesse die Augen und fahre mit dem Stift hindurch, ohne die Linien zu berühren.","Merke dir die ungefähre Handbewegung wie eine Kurvenfahrt beim Autofahren.","Linie verläuft komplett innerhalb der Bahn ohne Berührung."],
  [4,"leicht",30,"Detail-Blick-Kleidung","Schliesse sofort die Augen! Wie viele Knöpfe, Reissverschlüsse oder Taschen hat dein eigenes Oberteil/Hose heute (zähle im Kopf nach)?","Taste nicht mit den Händen, sondern erinnere dich ans Anziehen.","Exakte Anzahl genannt."],
  [4,"mittel",45,"Buch-Seiten-Schätzer","Schliesse die Augen. Der Vorleser drückt dir ein geschlossenes Buch in die Hand. Ertaste die Dicke der Papierseiten und schätze die ungefähre Seitenzahl.","Ein normales Taschenbuch mit 300 Seiten ist etwa 2 cm dick.","Abweichung maximal 20 Prozent der tatsächlichen Seitenzahl."],
  [4,"leicht",30,"Tonhöhen-Erkenner","Schliesse die Augen. Der Vorleser summt zwei Töne kurz hintereinander (3 Durchgänge). Sage sofort, ob der zweite Ton höher oder tiefer war als der erste.","Singe den ersten Ton innerlich kurz nach.","Alle 3 Durchgänge richtig erkannt."],
  [4,"mittel",45,"Wort-Kette-Hören","Der Vorleser nennt 6 völlig unzusammenhängende Wörter (z. B. 'Lampe, Tiger, Wolke, Löffel, Schnee, Fahrrad'). Wiederhole sie danach in exakt UMGEKEHRTER Reihenfolge.","Verknüpfe die Wörter im Kopf zu einer kleinen Bildergeschichte.","Alle 6 Wörter rückwärts in der richtigen Reihenfolge."],
  [4,"knacknuss",60,"Duft-Gedächtnis","Schliesse die Augen. Der Vorleser hält dir nacheinander 3 verschiedene Gegenstände oder Lebensmittel unter die Nase (z. B. Kaffee, Zitrone, Seife, Holz). Benenne alle 3.","Atme ruhig durch die Nase ein und halte kurz inne.","Alle 3 Gerüche korrekt benannt."],
  [4,"leicht",30,"Winkel-Drehung-Blind","Stelle dich hin, schliesse die Augen und drehe dich auf der Stelle so weit nach rechts, bis du glaubst, dass du exakt um 180 Grad (Blick nach hinten) gedreht bist.","Nutze zwei saubere 90-Grad-Vierteldrehungen als Orientierung.","Abweichung maximal 15 Grad von der exakten Gegenrichtung."],
  [4,"mittel",45,"Karten-Sortierer-Blind","Schliesse die Augen. Der Vorleser gibt dir einen gemischten Stapel aus 6 Spielkarten und 4 normalen Papierzetteln. Trenne beide Arten in unter 15 Sekunden in zwei Stapel.","Spielkarten sind glatter, fester und haben abgerundete Ecken.","Alle 10 Teile fehlerfrei sortiert."],
  [4,"leicht",30,"Raum-Geräusche-Filter","Die ganze Gruppe ist 15 Sekunden lang mucksmäuschenstill. Nenne danach mindestens 3 leise Hintergrundgeräusche, die du gehört hast (z. B. Uhrticken, Kühlschrank, Autos draussen).","Schliesse die Augen und konzentriere dich nach aussen.","Mindestens 3 reale Geräusche benannt."],
  [4,"mittel",45,"Rücken-Wort-Leser","Schliesse die Augen. Ein Mitspieler schreibt dir ein kurzes Wort aus 4 Grossbuchstaben (z. B. 'BAUM' oder 'MOND') mit dem Finger auf den Rücken. Nenne das Wort.","Schreibe jeden Buchstaben sofort im Kopf auf.","Wort korrekt erkannt."],
  [4,"knacknuss",60,"Doppel-Rhythmus-Hören","Der Vorleser klopft mit der linken Hand einen gleichmässigen Takt und schnipst gleichzeitig mit der rechten Hand unregelmässig dazu. Zähle nur die Schnipser mit.","Blende das tiefe Klopfen komplett aus und achte nur auf das hohe Schnipsen.","Exakte Anzahl der Schnipser genannt."],
  [4,"leicht",30,"Fingerspitzen-Abstand","Schliesse die Augen und halte deine beiden Zeigefingerspitzen genau 15 Zentimeter voneinander entfernt in die Luft. Danach wird mit dem Lineal nachgemessen.","Stelle dir die Länge eines normalen Kugelschreibers zwischen den Fingern vor.","Toleranz: 12,5 cm bis 17,5 cm."],
  [4,"mittel",45,"Tempo-Halten","Der Vorleser klopft 5 Sekunden lang ein mittleres Tempo vor und hört dann auf. Klopfe 15 Sekunden lang allein im exakt gleichen Tempo weiter (Vorleser prüft mit Stoppuhr/Metronom).","Behalte den Rhythmus als inneres Nicken bei.","Endtempo stimmt fast exakt mit dem Starttempo überein."],
  [4,"leicht",30,"Material-Klang","Schliesse die Augen. Der Vorleser klopft mit einem Stift nacheinander an 4 verschiedene Materialien im Raum (z. B. Holz, Glas, Metall, Plastik). Benenne alle 4.","Glas klingt hell nach, Holz dumpf und kurz.","Alle 4 Materialien richtig erkannt."],
  [4,"mittel",45,"50-Sekunden-Gefühl","Schliesse die Augen und sage 'Stopp', wenn du glaubst, dass exakt 50 Sekunden vergangen sind.","Teile die Zeit innerlich in zwei 25-Sekunden-Blöcke auf.","Abweichung maximal 4 Sekunden (46,0 bis 54,0 Sek.)."],
  [4,"knacknuss",60,"Blind-Schlüssel-Schloss","Schliesse die Augen. Der Vorleser gibt dir ein Vorhängeschloss (oder ein Türschloss/Etui) und einen Bund mit 4 Schlüsseln. Finde den passenden Schlüssel und öffne es blind.","Prüfe zuerst die Grösse und Form des Schlüssellochs mit dem Fingernagel.","Schloss erfolgreich blind geöffnet."],
  [4,"leicht",30,"Augen-Zu-Sitzordnung","Schliesse sofort die Augen! Nenne alle Mitspieler der Reihe nach im Uhrzeigersinn, beginnend bei deinem linken Sitznachbarn, plus jeweils die Farbe ihrer Augen oder Haare.","Gehe im Geist einmal um den gesamten Tisch herum.","Reihenfolge und Merkmale komplett richtig."],
  [4,"mittel",45,"Flüster-Satz","Ein Mitspieler flüstert aus 2 Metern Entfernung einen kurzen Satz aus 4 Wörtern (ohne Stimme, nur Lippen und Atem). Wiederhole den Satz exakt.","Achte auf die Lippenbewegungen und den Sprachrhythmus.","Satz komplett richtig verstanden."],
  [4,"leicht",30,"Gegenstand-Erkennen-Fuss","Ziehe einen Socken aus, schliesse die Augen und ertaste mit deiner Fusssohle 2 verschiedene Gegenstände, die der Vorleser vor dich auf den Boden legt.","Fahre mit den Zehen und dem Fussgewölbe über die Konturen.","Beide Gegenstände richtig benannt."],
  [4,"mittel",45,"Lied-Tempo-Check","Singe oder summe die erste Strophe eines bekannten Liedes (z. B. 'Bruder Jakob') genau halb so schnell wie normal – ohne aus dem Rhythmus zu fallen.","Ziehe jeden einzelnen Ton doppelt so lang wie gewohnt.","Melodie und langsames Tempo sauber gehalten."],
  [4,"knacknuss",60,"Spiegel-Zeichnen-Blind","Schliesse die Augen und zeichne gleichzeitig mit beiden Händen (links und rechts je ein Stift) zwei symmetrische Herzen oder Tannenbäume auf ein Blatt Papier.","Starte beide Hände exakt am gleichen oberen Punkt und bewege sie spiegelbildlich nach aussen.","Zwei erkennbare, weitgehend symmetrische Figuren gezeichnet."],
  [4,"leicht",30,"Münz-Fall-Hören","Schliesse die Augen. Der Vorleser lässt nacheinander eine kleine Münze und ein grösseres Geldstück auf den Tisch fallen (3 Durchgänge). Erkenne, welche Münze schwerer war.","Grössere Münzen klingen dumpfer und lauter beim Aufprall.","Alle 3 Durchgänge richtig unterschieden."],
  [4,"mittel",45,"Blick-Gedächtnis-Buch","Schau dir ein aufgeschlagenes Buch oder eine Zeitschrift 10 Sekunden lang genau an und schliesse dann die Augen. Nenne 4 Dinge, die auf der Seite zu sehen waren (z. B. Bilder, Überschriften, Farben).","Merke dir zuerst die grobe Aufteilung links und rechts.","Mindestens 4 korrekte Details genannt."],
  [4,"leicht",30,"Fuss-Schritt-Länge","Schliesse die Augen und mache einen einzelnen Schritt nach vorne, der exakt 80 Zentimeter lang ist. Danach wird von Ferse zu Ferse nachgemessen.","Ein normaler grosser Erwachsenenschritt liegt bei etwa 75 bis 85 cm.","Toleranz: 70 cm bis 90 cm."],
  [4,"mittel",45,"Stimmen-Anzahl","Schliesse die Augen. Mehrere Mitspieler sagen gleichzeitig 'Hallo'. Nenne sofort die exakte Anzahl der Personen, die gesprochen haben (3 Durchgänge).","Konzentriere dich auf unterschiedliche Tonhöhen (hoch und tief).","Alle 3 Durchgänge richtig gezählt."],
  [4,"knacknuss",60,"Blind-Origami-Falt","Schliesse die Augen und falte aus einem normalen Blatt Papier ein erkennbares Papierflugzeug, das am Ende mindestens 2 Meter weit fliegt.","Streiche jede Mittellinie exakt mit dem Daumennagel nach, damit die Flügel symmetrisch werden.","Flieger gefaltet und fliegt mindestens 2 Meter."],
  [4,"leicht",30,"Raum-Temperatur-Schätzer","Schätze die aktuelle Raumtemperatur in diesem Zimmer auf ein halbes Grad genau (Vorleser prüft per Thermostat oder Wetter-App).","Normale Wohnräume liegen meist zwischen 20 und 22 Grad.","Abweichung maximal 1,5 Grad."],
  [4,"mittel",45,"Wort-Anfangs-Filter","Der Vorleser liest eine Liste aus 12 Wörtern vor. Klatsche immer dann sofort einmal in die Hände, wenn ein Wort mit dem Buchstaben 'S' beginnt.","Halte die Hände schon leicht geöffnet bereit, um ohne Verzögerung zu klatschen.","Alle 'S'-Wörter ohne Fehler beklatscht."],
  [4,"leicht",30,"Tast-Zahlen","Schliesse die Augen. Der Vorleser legt dir eine bestimmte Anzahl kleiner Gegenstände (z. B. Büroklammern, Münzen oder Bohnen) in die geschlossene Hand. Zähle sie nur durch Fühlen in der Faust (2 Durchgänge).","Schiebe die Teile mit dem Daumen einzeln an den Zeigefinger.","Beide Durchgänge exakt gezählt."],
  [4,"mittel",45,"40-Sekunden-Puls","Schliesse die Augen und sage 'Stopp', wenn genau 40 Sekunden vergangen sind – während du gleichzeitig 10 Mal tief ein- und ausatmest.","Zähle deine Atemzüge ruhig mit; ein tiefer Atemzug dauert etwa 4 Sekunden.","Abweichung maximal 3 Sekunden (37,0 bis 43,0 Sek.)."],
  [4,"knacknuss",60,"Blind-Schrift-Erkenner","Schliesse die Augen. Ein Mitspieler formt mit einem Band, Kabel oder Schnürsenkel einen Grossbuchstaben auf dem Tisch. Ertaste die Form und nenne den Buchstaben (2 Runden).","Fühle zuerst die äusseren Enden des Bandes, um die Form zu erfassen.","Beide Buchstaben richtig erraten."],
  [4,"leicht",30,"Geräusch-Entfernung","Schliesse die Augen. Ein Mitspieler klatscht einmal nah vor dir (ca. 50 cm) und einmal weit weg im Raum (ca. 3–4 m). Sage sofort, ob es nah oder fern war (4 Durchgänge).","Achte auf den Raumhall bei grösserer Entfernung.","Alle 4 Durchgänge richtig erkannt."],
  [4,"mittel",45,"Farb-Gedächtnis-Raum","Schliesse sofort die Augen! Nenne 4 verschiedene Dinge im Raum, die aus Holz bestehen, und 3 Dinge, die aus Glas sind.","Gehe im Geist von den Möbeln bis zu den Gegenständen auf dem Tisch.","Alle 7 Dinge korrekt benannt."],
  [4,"leicht",30,"Zwei-Finger-Abstand","Schliesse die Augen und führe die Zeigefinger beider Hände aus ausgestreckten Armen langsam aufeinander zu, bis sie sich exakt an den Spitzen berühren (3 Versuche).","Bewege beide Arme gleichmässig auf Brusthöhe zur Mitte.","Mindestens 2 von 3 Versuchen treffen direkt aufeinander."],
  [4,"mittel",45,"Rhythmus-Kanone","Der Vorleser klopft einen 6-Schlag-Rhythmus. Wiederhole ihn zuerst exakt, und klopfe ihn danach sofort doppelt so schnell.","Merke dir den Rhythmus wie ein kurzes Schlagzeug-Solo.","Normal und doppelt so schnell sauber geklopft."],
  [4,"knacknuss",60,"Geschmacks- oder Geruchs-Trio","Schliesse die Augen. Der Vorleser hält dir nacheinander 3 verschiedene Getränke oder Küchenzutaten unter die Nase. Benenne mindestens 2 davon exakt.","Atme zwischen den Proben kurz durch den Mund aus.","Mindestens 2 von 3 Proben exakt benannt."],
  [4,"leicht",30,"Gewichts-Schätzer-Handy","Schliesse die Augen. Der Vorleser legt dir ein fremdes Smartphone (oder Buch) in die Hand. Schätze sein Gewicht auf 30 Gramm genau.","Ein normales Smartphone wiegt meist zwischen 170 und 220 Gramm.","Abweichung maximal 35 Gramm."],
  [4,"mittel",45,"Silben-Zähler","Der Vorleser sagt 4 lange Wörter (z. B. 'Donauschifffahrtskapitän'). Nenne jeweils innerhalb von 3 Sekunden die exakte Anzahl der Silben.","Sprich das Wort im Kopf rhythmisch mit.","Alle 4 Silbenanzahlen richtig genannt."],
  [4,"leicht",30,"Hand-Wärme-Test","Schliesse die Augen. Halte deine Handfläche 5 cm über verschiedene Körperteile oder Gegenstände und finde allein durch die Wärmeabstrahlung heraus, wo die Hand eines Mitspielers ist (3 Runden).","Bewege deine Hand langsam wie ein Radar über den Tisch.","Alle 3 Runden die Hand des Mitspielers gefunden."],
  [4,"mittel",45,"10-Sekunden-Blitz","Schliesse die Augen und sage exakt nach 10 Sekunden 'Stopp' – während alle Mitspieler gleichzeitig in die Hände klatschen.","Blende das Klatschen aus und zähle innerlich ruhig bis 10.","Abweichung maximal 1 Sekunde (9,0 bis 11,0 Sek.)."],
  [4,"knacknuss",60,"Blind-Zeichnen-Haus-Detail","Schliesse die Augen und zeichne ein Haus mit Dach, Tür, zwei Fenstern und einem rauchenden Schornstein – ohne dass sich die Linien wild überschneiden.","Nutze deine freie Hand als Begrenzung für die Hauswände.","Alle 5 Elemente sind an der richtigen Stelle erkennbar."],
  [4,"leicht",30,"Klang-Unterscheidung","Schliesse die Augen. Der Vorleser streicht mit dem Fingernagel über 3 verschiedene Oberflächen (z. B. Jeansstoff, Papier, Holz). Erkenne alle 3 am Geräusch.","Achte auf das helle Rascheln von Papier im Vergleich zum rauen Stoff.","Alle 3 Materialien am Geräusch erkannt."],
  [4,"mittel",45,"Körper-Grössen-Reihe","Schliesse die Augen. Stelle dir alle anwesenden Mitspieler nebeneinander vor und nenne sie exakt der Körpergrösse nach vom Kleinsten bis zum Grössten.","Vergleiche die Personen paarweise miteinander.","Komplette Reihenfolge fehlerfrei genannt."],
  [4,"leicht",30,"Linien-Parallel","Zeichne mit geschlossenen Augen zwei waagerechte Linien untereinander (Abstand ca. 3 cm), die möglichst exakt parallel zueinander verlaufen.","Bewege den ganzen Unterarm aus dem Ellbogen heraus.","Linien verlaufen weitgehend parallel ohne sich zu berühren."],
  [4,"mittel",45,"Wort-Echo-Rückwärts","Der Vorleser nennt eine Kette aus 5 Zahlen (z. B. '7 - 2 - 9 - 4 - 1'). Wiederhole die Zahlenkette sofort rückwärts ('1 - 4 - 9 - 2 - 7') – 2 Durchgänge.","Merke dir die Zahlen als melodischen Klang.","Beide Zahlenketten fehlerfrei rückwärts genannt."],
  [4,"knacknuss",60,"Gleichgewichts-Sinn-Blind","Stehe auf einem Bein, schliesse die Augen und neige den Kopf langsam weit in den Nacken (Blick zur Decke). Halte diese Position 10 Sekunden lang.","Spanne die Fussmuskeln und die Bauchmitte fest an.","10 Sekunden ohne Absetzen des zweiten Fusses gehalten."],
  [4,"leicht",30,"Takt-Stopp","Der Vorleser klopft ein gleichmässiges Tempo und stoppt plötzlich. Klatsche exakt in dem Moment einmal in die Hände, in dem der nächste Schlag gekommen wäre (3 Durchgänge).","Nicke innerlich im Takt weiter, auch wenn das Klopfen aufhört.","Mindestens 2 von 3 Einsätzen exakt auf den Punkt getroffen."],
  [4,"mittel",45,"Münz-Kopf-oder-Zahl-Fühler","Schliesse die Augen. Der Vorleser gibt dir eine Münze in die Hand. Ertaste allein mit dem Daumen, ob die Zahlseite oder die Bildseite oben liegt (3 Durchgänge).","Die Zahlseite hat meist eine grosse, glatte Ziffer und einen klareren Rand.","Alle 3 Münzen richtig erkannt."],
  [4,"leicht",30,"Geräusch-Anzahl-Klatschen","Schliesse die Augen. Zwei Mitspieler klatschen abwechselnd und sehr schnell insgesamt zwischen 8 und 15 Mal. Nenne die exakte Gesamtzahl.","Zähle nicht die Personen, sondern nur jeden einzelnen Knall.","Exakte Gesamtzahl genannt."],
  [4,"mittel",45,"Blick-Gedächtnis-Person","Schau einen Mitspieler 10 Sekunden lang genau an und schliesse die Augen. Nenne 5 Details zu ihm (z. B. Haarscheitel-Seite, Uhr links/rechts, Schuhfarbe, Muster).","Scanne die Person von Kopf bis Fuss systematisch ab.","Alle 5 Details zutreffend genannt."],
  [4,"knacknuss",60,"Blind-Zeichnen-Stern","Schliesse die Augen und zeichne einen klassischen fünfzackigen Stern in einem einzigen durchgehenden Linienzug, ohne den Stift abzusetzen.","Merke dir die 5 Richtungswechsel im Handgelenk.","Erkennbarer fünfzackiger Stern gezeichnet."],
  [4,"leicht",30,"Papier-Gewicht-Test","Schliesse die Augen. Der Vorleser legt dir einmal ein einzelnes Blatt Papier und einmal gar nichts auf deine ausgestreckte flache Handfläche (4 Durchgänge). Erkenne, ob das Blatt da ist.","Achte auf den winzigen Luftzug und das leichte Aufliegen auf den Härchen.","Alle 4 Durchgänge richtig erkannt."],
  [4,"mittel",45,"Rückwärts-Buchstabier-Hören","Der Vorleser buchstabiert zwei 5-buchstabige Wörter rückwärts (z. B. 'S-I-E-R-P' für PREIS). Nenne beide Wörter jeweils innerhalb von 8 Sekunden.","Stelle dir die Buchstaben von rechts nach links vor.","Beide Wörter richtig erkannt."],
  [4,"leicht",30,"Distanz-Fuss-Check","Stelle dich vor einen Stuhl oder eine Wand, schliesse die Augen und halte deine Fussspitze exakt 10 Zentimeter davor in die Luft. Danach wird gemessen.","Nutze deine eigene Fussbreite als Vergleichsmass.","Toleranz: 7 cm bis 13 cm Abstand."],
  [4,"mittel",45,"Rhythmus-Verdoppler-Klatschen","Der Vorleser klopft 4 Schläge vor. Wiederhole sie sofort, aber betone jeden zweiten Schlag doppelt so laut (leise – LAUT – leise – LAUT) – 3 Runden.","Hebe die Hand vor dem lauten Schlag etwas höher an.","Alle 3 Runden mit klarer Betonung geklatscht."],
  [4,"knacknuss",60,"Sinne-Kombi-Test","Schliesse die Augen, stehe auf einem Bein und sage exakt nach 20 Sekunden 'Stopp', während dir der Vorleser 3 verschiedene Gegenstände nacheinander in die Hand gibt, die du benennen musst.","Teile deine Aufmerksamkeit ruhig zwischen Zählen und Tasten auf.","Zeitabweichung max. 3 Sek., alle 3 Gegenstände erkannt und nicht abgesetzt."],
  [5,"leicht",45,"Papierflieger","Falte aus einem A4-Blatt einen Papierflieger, der mind. 5 Meter weit fliegt (3 Versuche).","Spitze mehrfach falten für Gewicht vorne.","Fliegt mindestens 5 Meter."],
  [5,"leicht",30,"Blitz-Falter","Falte ein T-Shirt oder Handtuch in unter 15 Sekunden ordentlich zusammen.","Flach hinlegen, Seiten einschlagen, halbieren.","Ordentlich gefaltet in unter 15 Sek."],
  [5,"mittel",45,"Stabile Seitenlage","Erkläre oder zeige alle Schritte der stabilen Seitenlage bei einer bewusstlosen Person.","Kopf überstrecken nicht vergessen!","Alle wichtigen Schritte korrekt."],
  [5,"mittel",45,"250-Gramm-Gefühl","Fülle Gegenstände in ein Gefäss, bis du glaubst, es sind exakt 250 Gramm. Danach wiegen.","Eine Tafel Schokolade wiegt 100g.","Toleranz: 210g bis 290g."],
  [5,"leicht",30,"Notfall-Rezept","Nenne 3 verschiedene Gerichte aus Eiern, Mehl, Milch und Kartoffeln.","Denke an Pfannkuchen oder Rösti.","3 plausible Gerichte."],
  [5,"mittel",45,"Blitz-Schleife","Binde einen Schuh oder ein Band in unter 5 Sekunden zu.","Beide Schlaufen gleichzeitig formen.","Feste Schleife in unter 5 Sek."],
  [5,"leicht",30,"Die 5 W-Fragen","Nenne die 5 W-Fragen für einen Notruf am Telefon.","Wo, Was, Wie viele, Welche, Warten.","Alle 5 Fragen genannt."],
  [5,"knacknuss",60,"Papier-Ständer","Baue aus 1 Blatt Papier (ohne Kleber/Schere) einen Ständer, der ein Handy hält.","Ziehharmonika falten oder Säulen rollen.","Handy steht 5 Sekunden sicher."],
  [5,"knacknuss",45,"Ei-Frischetest","Erkläre, wie man ein rohes Ei ohne Aufschlagen auf Frische testet und warum es klappt.","Du brauchst ein Glas kaltes Wasser.","Frische sinken; alte schwimmen wegen Luftkammer."],
  [5,"knacknuss",45,"100 ml blind","Giesse mit geschlossenen Augen exakt 100 ml Wasser in ein Glas. Danach abmessen.","Gleichmässig giessen und mitzählen.","Toleranz: 80 ml bis 120 ml."],
  [5,"leicht",30,"Flecken-Retter","Wie entfernt man frische Rotweinflecken oder Kerzenwachs aus Textilien? Nenne ein Hausmittel.","Wachs erst einfrieren und abbröckeln.","Sinnvolles Hausmittel genannt."],
  [5,"mittel",35,"Krawatten- oder Schal-Knoten","Binde einen sauberen einfachen Knoten (Four-in-Hand) mit einem Schal, Gürtel oder einer Krawatte.","Breites Ende einmal um das schmale wickeln.","Sauberer Knoten gebunden."],
  [5,"leicht",25,"Müll-Trennung","Nenne 4 Dinge, die NICHT ins Altpapier gehören, obwohl sie aus Papier/Pappe sind.","Denke an beschichtetes Papier oder Kassenzettel.","Z.B. Kassenzettel, Pizzakarton mit Fett, Backpapier, Taschentücher."],
  [5,"mittel",40,"Himmelsrichtung","Zeige ohne Kompass oder Handy in diesem Raum exakt nach Norden (Vorleser prüft mit Handy).","Überlege, wo die Sonne mittags steht (Süden).","Abweichung maximal 25 Grad."],
  [5,"knacknuss",45,"Kopfrechnen-Einkauf","Addiere im Kopf: 3,49 + 1,99 + 4,50 + 2,75 + 0,89.","Runde erst auf volle Euro und ziehe Cents ab.","13,62."],
  [5,"leicht",30,"Krawatten- oder Schal-Profi","Binde dir (oder einem Mitspieler) einen ordentlichen einfachen Knoten mit einem Schal, Gürtel oder einer Krawatte in unter 20 Sekunden.","Das breite Ende einmal um das schmale herumführen und durch die Halsschlaufe ziehen.","Sauberer, symmetrischer Knoten in unter 20 Sekunden."],
  [5,"mittel",45,"Zahlen-Merk-Einkauf","Der Vorleser liest eine Einkaufsliste mit 8 Artikeln einmal vor. Wiederhole mindestens 7 davon nach 15 Sekunden Pause in beliebiger Reihenfolge.","Verknüpfe die Artikel zu einem verrückten Gericht in deiner Vorstellung.","Mindestens 7 von 8 Artikeln richtig genannt."],
  [5,"leicht",30,"Notfall-Wissen: Verbrennung","Was ist die wichtigste und beste Erste-Hilfe-Massnahme bei einer leichten, kleinflächigen Verbrennung im Haushalt (z. B. am Backofen)?","Kein Eis, kein Mehl und keine Salbe verwenden!","Sofort ca. 10–15 Minuten mit handwarmem (nicht eiskaltem!) Leitungswasser kühlen."],
  [5,"mittel",45,"Münzgeld-Wechsler","Du kaufst für 13,65 Franken/Euro ein und zahlst mit einem 20er-Schein. Nenne innerhalb von 10 Sekunden das exakte Rückgeld und die kleinstmögliche Anzahl an Münzen/Scheinen.","Rechne erst bis 14,00 hoch (35 Rappen/Cent) und dann bis 20,00 (6 Franken/Euro).","6,35 – bestehend aus 1x 5er-Schein/Münze, 1x 1er, 1x 20er, 1x 10er, 1x 5er."],
  [5,"knacknuss",60,"Papier-Tragkraft-Brücke","Baue aus einem einzigen normalen DIN-A4-Blatt (ohne Kleber oder Schere) eine Brücke zwischen zwei im Abstand von 15 cm stehenden Büchern, die ein volles Glas oder ein Handy trägt.","Falte das Blatt eng wie eine Ziehharmonika – diese Dreiecksrippen tragen ein Vielfaches des Eigengewichts!","Konstruktion trägt den Gegenstand für mindestens 5 Sekunden."],
  [5,"leicht",30,"Stromspar-Detektiv","Nenne 4 typische 'Stromfresser' im Haushalt, die auch im Standby-Modus oder bei falscher Einstellung unnötig viel Energie verbrauchen.","Denke an Küche, Wohnzimmer und Badezimmer.","Z. B. alter Kühlschrank, Wäschetrockner, Spielekonsole/TV im Standby, Heizlüfter, Wasserkocher zu voll."],
  [5,"mittel",45,"Geschenk-Verpacker-Trockenübung","Schlage ein Buch oder eine Schachtel mit einem normalen Blatt Papier (oder Zeitung) so ordentlich und faltenfrei ein, dass alle Kanten sauber umgelegt sind.","Schlage zuerst die langen Seiten ein und falte die kurzen Enden zu sauberen Dreiecken.","Sauber eingeschlagenes Paket in unter 45 Sekunden."],
  [5,"leicht",30,"Küche: Schneide-Technik","Erkläre und zeige mit den Fingern den sogenannten 'Krallengriff' beim Gemüseschneiden – und warum er so wichtig ist.","Die Fingerkuppen werden nach innen unter die Knöchel gezogen.","Korrekte Haltung gezeigt und erklärt (schützt die Fingerspitzen vor der Klinge)."],
  [5,"mittel",45,"Kalender-Kopfrechnen","Welches Datum haben wir heute in genau 14 Tagen – und welcher Wochentag ist in genau 10 Tagen?","In 14 Tagen ist exakt derselbe Wochentag wie heute.","Beide Angaben (Datum und Wochentag) fehlerfrei genannt."],
  [5,"knacknuss",60,"Schuhband-Chirurg: Doppelknoten-Trick","Binde einen Schuhband-Knoten, der sich beim Gehen garantiert nicht von selbst löst, sich aber trotzdem mit einem einzigen Zug am losen Ende wieder aufziehen lässt.","Wickle das Band vor dem Durchziehen der Schlaufe zweimal statt einmal umeinander.","Fester Knoten gebunden, der sich durch Ziehen an einem Ende sofort löst."],
  [5,"leicht",30,"Haltbarkeit-Check","Welche 3 Lebensmittel aus dem Vorratsschrank sind bei trockener Lagerung praktisch unbegrenzt (jahrelang) haltbar, auch wenn ein Mindesthaltbarkeitsdatum aufgedruckt ist?","Denke an Süsse, Würze und trockene Körner.","Z. B. Honig, Salz, Zucker, trockener Reis, getrocknete Hülsenfrüchte."],
  [5,"mittel",45,"Koffer-Pack-Logik","Nenne die 4 wichtigsten Tipps, um einen kleinen Handgepäck-Koffer möglichst platzsparend und knitterfrei zu packen.","Rollen statt falten, schwere Dinge nach unten zu den Rollen.","Mindestens 3 sinnvolle Profi-Tipps genannt (Rollen, Schuhe füllen, Schweres nach unten, Zwiebellook)."],
  [5,"leicht",30,"Verkehrssicherheit","Wie lautet die Faustregel für den Sicherheitsabstand ausserorts (auf Landstrassen) in Sekunden – und wie merkt man sich das leicht?","Orientiere dich an einem Leitpfosten oder Baum am Strassenrand.","Mindestens 2 Sekunden Abstand ('Zwei-Sekunden-Regel': Zweiundzwanzig, dreiundzwanzig zählen)."],
  [5,"mittel",45,"Tisch-Knigge","Decke einen Platz am Tisch für ein Drei-Gänge-Menü korrekt ein (oder lege Besteck, Glas und Serviette in der exakt richtigen Reihenfolge hin).","Messer rechts (Schneide zum Teller), Gabel links, Wasserglas über dem Messer.","Korrekte Anordnung gelegt oder exakt erklärt."],
  [5,"knacknuss",60,"Reifenpanne-Ablauf","Nenne alle 6 wichtigsten Schritte in der richtigen Reihenfolge, wenn du auf einer Landstrasse einen platten Autoreifen wechseln musst (inkl. Absicherung).","Warnweste und Warndreieck kommen noch vor dem Wagenheber!","1. Warnblinker & Weste, 2. Warndreieck aufstellen, 3. Handbremse & Gang einlegen, 4. Radmuttern leicht lösen, 5. Wagenheber ansetzen & wechseln, 6. Muttern über Kreuz festziehen."],
  [5,"leicht",30,"Wäsche-Symbole","Was bedeuten die drei klassischen Pflege-Symbole auf Kleidungsetiketten: ein Bottich mit Wasser, ein Dreieck und ein Kreis?","Wasser steht für Waschen, das Dreieck hat drei Ecken wie Bleichmittel.","Bottich: Waschen, Dreieck: Bleichen, Kreis: Professionelle Reinigung."],

  const DB = RAW_DB.map((r, i) => ({
    id: i + 1,
    kategorie: KATS[r[0]],
    schwierigkeit: r[1],

  document.getElementById("ts-status").innerHTML = `<span style="color:var(--ok);">✔ ${DB.length} Aufgaben geladen (alle 8 Kategorien komplett).</span>`;

  window.tsAddField = function() {
    const div = document.getElementById("ts-p-inputs");
    const inp = document.createElement("input");
    inp.type = "text";
    inp.className = "ts-p-in";
    inp.placeholder = `Name Spieler ${div.children.length + 1}...`;
    div.appendChild(inp);
  };

  function show(id) {
    document.querySelectorAll("#ts-app-root .ts-scr").forEach(e => e.classList.remove("act"));
    document.getElementById(id).classList.add("act");
  }

  window.tsStart = function() {
    const names = Array.from(document.querySelectorAll("#ts-app-root .ts-p-in")).map(i => i.value.trim()).filter(v => v !== "");
    if (names.length < 2) { alert("Bitte mindestens 2 Namen eintragen!"); return; }
    players = names.map(n => {
      let sc = {}; KATS.forEach(k => sc[k] = 0);
      return { name: n, scores: sc };
    });
    diff = document.getElementById("ts-diff").value;
    const m = parseInt(document.getElementById("ts-dur").value);
    if (m > 0) {
      gSec = m * 60;
      gInt = setInterval(() => {
        gSec--;
        if (gSec > 0) {
          document.getElementById("ts-g-tmr").innerText = `${String(Math.floor(gSec/60)).padStart(2,'0')}:${String(gSec%60).padStart(2,'0')}`;
        } else {
          clearInterval(gInt);
          finalRnd = true;
          document.getElementById("ts-g-tmr").innerText = "Letzte Runde!";
          document.getElementById("ts-g-tmr").style.color = "var(--no)";
        }
      }, 1000);
    } else {
      document.getElementById("ts-g-tmr").innerText = "Unbegrenzt";
    }
    pIdx = 0; streak = 0;
    nextTurn(false);
  };

  function getPool(catFilter) {
    let pool = DB.filter(t => !used.has(t.id));
    if (diff !== "alle") {
      let dp = pool.filter(t => t.schwierigkeit === diff);
      if (dp.length > 0) pool = dp;
    }
    if (catFilter) {
      let cp = pool.filter(t => t.kategorie === catFilter);
      if (cp.length > 0) pool = cp;
    }
    if (pool.length === 0) { used.clear(); return getPool(catFilter); }
    return pool;
  }

  function nextTurn(jokerOpen) {
    const act = players[pIdx];
    let cands = players.map((_, i) => i).filter(i => i !== pIdx);
    rIdx = cands[Math.floor(Math.random() * cands.length)];
    jQual = false; jBonus = false;

    if (jokerOpen) {
      const open = KATS.filter(k => act.scores[k] < 3);
      const chosen = open[Math.floor(Math.random() * open.length)];
      const pool = getPool(chosen);
      task = pool[Math.floor(Math.random() * pool.length)];
      jBonus = true;
    } else {
      const pool = getPool(null);
      task = pool[Math.floor(Math.random() * pool.length)];
      if (act.scores[task.kategorie] >= 3) jQual = true;
    }
    used.add(task.id);

    document.getElementById("ts-p-act").innerText = act.name;
    document.getElementById("ts-p-str").innerText = streak;
    document.getElementById("ts-p-rdr").innerText = players[rIdx].name;
    document.getElementById("ts-p-hide").innerText = act.name;

    const jm = document.getElementById("ts-j-msg");
    if (jQual) {
      jm.style.display = "block";
      jm.innerText = `★ JOKER-CHANCE! „${task.kategorie}“ ist schon voll (3/3). Löse diese 4. Aufgabe für eine Zufalls-Kategorie!`;
    } else if (jBonus) {
      jm.style.display = "block";
      jm.innerText = `★ JOKER-EINSATZ! Du spielst jetzt um einen Punkt in „${task.kategorie}“!`;
    } else {
      jm.style.display = "none";
    }
    renderTable("ts-sb-1");
    show("ts-s-priv");
  }

  window.tsReveal = function() {
    document.getElementById("ts-t-act").innerText = players[pIdx].name;
    document.getElementById("ts-t-rdr").innerText = players[rIdx].name;
    document.getElementById("ts-t-cat").innerText = task.kategorie;
    document.getElementById("ts-t-meta").innerText = "Stufe: " + task.schwierigkeit.toUpperCase();
    document.getElementById("ts-t-tit").innerText = task.titel;
    document.getElementById("ts-t-dsc").innerText = task.aufgabe;
    document.getElementById("ts-t-sol").innerText = task.loesung;
    document.getElementById("ts-t-joker").style.display = (jQual || jBonus) ? "inline-block" : "none";

    document.getElementById("ts-b-hnt").style.display = "none";
    document.getElementById("ts-t-hnt").style.display = "none";
    document.getElementById("ts-t-hnt").innerHTML = `<strong>Empfehlung:</strong> ${task.tipp}`;

    clearInterval(tInt); tRun = false;
    tTot = task.zeit; tLeft = tTot;
    document.getElementById("ts-b-tmr").innerText = "Timer starten";
    updTmr();
    show("ts-s-task");
  };

  window.tsTglTmr = function() {
    if (tRun) {
      clearInterval(tInt); tRun = false;
      document.getElementById("ts-b-tmr").innerText = "Weiter";
    } else {
      tRun = true;
      document.getElementById("ts-b-tmr").innerText = "Pause";
      tInt = setInterval(() => {
        tLeft--; updTmr();
        if (tLeft <= Math.floor(tTot / 2)) document.getElementById("ts-b-hnt").style.display = "inline-block";
        if (tLeft <= 0) { clearInterval(tInt); tRun = false; document.getElementById("ts-b-tmr").innerText = "Zeit abgelaufen!"; }
      }, 1000);
    }
  };

  function updTmr() {
    const el = document.getElementById("ts-t-tmr");
    const v = Math.max(0, tLeft);
    el.innerText = `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;
    el.className = v <= 10 ? "ts-tmr low" : "ts-tmr";
  }

  window.tsShowHnt = function() {
    document.getElementById("ts-t-hnt").style.display = "block";
    document.getElementById("ts-b-hnt").style.display = "none";
  };

  window.tsDone = function(ok) {
    clearInterval(tInt);
    const act = players[pIdx];
    if (!ok) { pass(); return; }

    if (jQual) {
      if (KATS.some(k => act.scores[k] < 3)) {
        alert("Joker freigeschaltet! Es folgt sofort eine Zufallsaufgabe aus einer offenen Kategorie.");
        nextTurn(true);
        return;
      }
    }

    if (act.scores[task.kategorie] < 3) act.scores[task.kategorie]++;
    streak++;

    if (KATS.every(k => act.scores[k] >= 3)) {
      end(`${act.name} hat als Erste/r alle 8 Kategorien mit 3 Punkten erfüllt!`);
      return;
    }
    if (streak >= 3) {
      alert(`3 Punkte in Folge für ${act.name}! Jetzt wechselt das Spiel zum nächsten Spieler.`);
      pass();
    } else {
      nextTurn(false);
    }
  };

  function pass() {
    streak = 0; pIdx++;
    if (pIdx >= players.length) {
      pIdx = 0;
      if (finalRnd) { end("Die vereinbarte Spieldauer ist abgelaufen!"); return; }
    }
    nextTurn(false);
  }

  function renderTable(id) {
    let h = `<table><tr><th>Kategorie</th>${players.map(p => `<th>${p.name}</th>`).join("")}</tr>`;
    KATS.forEach(k => {
      h += `<tr><td>${k}</td>${players.map(p => `<td class="${p.scores[k]>=3?'ts-done':''}">${p.scores[k]}/3</td>`).join("")}</tr>`;
    });
    h += `<tr style="background:#f1f5f9;font-weight:bold;"><td>Gesamt</td>${players.map(p => `<td>${KATS.reduce((s,k)=>s+p.scores[k],0)}/24</td>`).join("")}</tr></table>`;
    document.getElementById(id).innerHTML = h;
  }

  function end(reason) {
    clearInterval(gInt); clearInterval(tInt);
    document.getElementById("ts-e-rsn").innerText = reason;
    let rk = players.map(p => ({ n: p.name, t: KATS.reduce((s,k)=>s+p.scores[k],0) })).sort((a,b) => b.t - a.t);
    let top = rk[0].t;
    let win = rk.filter(r => r.t === top).map(r => r.n);
    document.getElementById("ts-e-win").innerText = win.length > 1 ? `Unentschieden: ${win.join(" & ")} (${top} Punkte)` : `Sieger: ${win[0]} mit ${top} von 24 Punkten!`;
    renderTable("ts-sb-2");
    show("ts-s-end");
  }
})();
</script>
</body>
</html>
